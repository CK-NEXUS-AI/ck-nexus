[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ck-nexus-creator"
version = "0.2.0"
description = "Menu-driven AI workspace for creators, powered by the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "CK-NEXUS" }]
dependencies = [
  "fastapi>=0.116,<1",
  "openai-agents[sqlalchemy]>=0.19,<1",
  "asyncpg>=0.30,<1",
  "cryptography>=46,<51",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
ck-nexus = "creator_app.cli:main"

[project.optional-dependencies]
gateway = [
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=5,<7",
]
dev = [
  "bandit>=1.8,<2",
  "httpx2>=2.9,<3",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]
billing = [
  "aiosqlite>=0.20,<1",
  "opentelemetry-api>=1.27,<2",
  "sqlalchemy>=2.0,<3",
  "stripe>=11,<15",
]

email = [
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
]

github-app = [
  "PyJWT[crypto]>=2.10,<3",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*", "creator_app*", "services*", "gateway*", "orchestration*", "idea_engine*"]

[tool.setuptools.package-data]
creator_app = ["web/*", "skills/agnes/*"]
orchestration = ["patterns.json"]
"services.email_gateway" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
