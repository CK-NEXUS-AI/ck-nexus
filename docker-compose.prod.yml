services:
  db:
    image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    restart: unless-stopped
    environment:
      POSTGRES_DB: cknexus
      POSTGRES_USER: cknexus
      POSTGRES_PASSWORD: ${CKNEXUS_DB_PASSWORD:?set CKNEXUS_DB_PASSWORD}
    volumes:
      - cknexus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cknexus -d cknexus"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CKNEXUS_HOST: 0.0.0.0
      PORT: 8000
      CKNEXUS_DEVELOPMENT_STATUS_DB: /app/data/development-status.sqlite3
      CKNEXUS_MOCK_AI: "false"
      CKNEXUS_DATABASE_URL: postgresql://cknexus:${CKNEXUS_DB_PASSWORD}@db:5432/cknexus
      DATABASE_URL: postgresql://cknexus:${CKNEXUS_DB_PASSWORD}@db:5432/cknexus
      CKNEXUS_SESSION_DATABASE_URL: postgresql+asyncpg://cknexus:${CKNEXUS_DB_PASSWORD}@db:5432/cknexus
      CKNEXUS_EMAIL_DATABASE_URL: postgresql://cknexus:${CKNEXUS_DB_PASSWORD}@db:5432/cknexus
      CKNEXUS_EMAIL_GATEWAY_ENABLED: "true"
      CKNEXUS_AGNES_SANDBOX_ENABLED: "true"
      # Phase3 requires a genuinely delegated writable cgroup v2 subtree.
      # Standard Docker Compose does not provide that guarantee, so stay fail-closed by default.
      CKNEXUS_AGNES_PHASE3_ENABLED: ${CKNEXUS_AGNES_PHASE3_ENABLED:-false}
      CKNEXUS_AGNES_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      CKNEXUS_RUNTIME_BINDING_ENABLED: "true"
      RUNTIME_BINDING_FAIL_FAST: "true"
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-5}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
      CKNEXUS_EMAIL_WEBHOOK_TOKEN: ${CKNEXUS_EMAIL_WEBHOOK_TOKEN:?set CKNEXUS_EMAIL_WEBHOOK_TOKEN}
      CKNEXUS_ACCESS_TOKEN: ${CKNEXUS_ACCESS_TOKEN:?set CKNEXUS_ACCESS_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      CKNEXUS_EMAIL_LEASE_SECONDS: ${CKNEXUS_EMAIL_LEASE_SECONDS:-300}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_API_BASE: ${SLACK_API_BASE:-https://slack.com/api}
      GOOGLE_DRIVE_ACCESS_TOKEN: ${GOOGLE_DRIVE_ACCESS_TOKEN:-}
      GOOGLE_DRIVE_API_BASE: ${GOOGLE_DRIVE_API_BASE:-https://www.googleapis.com/drive/v3}
      CKNEXUS_INTEGRATION_TIMEOUT_SECONDS: ${CKNEXUS_INTEGRATION_TIMEOUT_SECONDS:-5}
    volumes:
      - cknexus_app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 30
    networks: [backend]

  edge:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CKNEXUS_DOMAIN: ${CKNEXUS_DOMAIN:?set CKNEXUS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - redis_data:/data
    networks: [backend]

networks:
  backend:

volumes:
  cknexus_pg:
  cknexus_app_data:
  redis_data:
  caddy_data:
  caddy_config:
