name: CK-NEXUS CI

on:
  push:
    branches: [main, release/q04-q08-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Q04 frozen sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
          .venv/bin/python -c "import aiosqlite,asyncpg,psycopg,redis; print('Q04 PASS')"
      - name: Compile and Ruff
        run: |
          .venv/bin/python -m compileall -q main.py creator_app services scripts
          .venv/bin/ruff check main.py creator_app services tests scripts --output-format=github
      - name: Bandit exact reviewed gate
        shell: bash
        run: |
          .venv/bin/bandit -r creator_app services main.py -f json -o bandit.json || true
          .venv/bin/python - <<'PY'
          import hashlib,json,sys
          r=json.load(open('bandit.json',encoding='utf-8'))
          ok={
            ('B608','services/email_gateway/repository.py',221,'a248369faca360edbca232b1700ef67d87d9eeae8401bb1b379122f3274a4a6a'),
            ('B608','services/email_gateway/repository.py',230,'2948e929a8c5a30e600e2d06c3cea59da396aa196adfd234183556d877df3de0'),
          }
          bad=[]
          for x in r.get('results',[]):
            if x.get('issue_severity') not in {'MEDIUM','HIGH'}: continue
            f=(x.get('test_id'),x.get('filename'),x.get('line_number'),hashlib.sha256(x.get('code','').encode()).hexdigest())
            if f not in ok: bad.append(f)
          print('blocking=',bad)
          sys.exit(bool(bad))
          PY
      - name: Secret scan
        run: .venv/bin/python scripts/secret_scan.py
      - name: Portable regression
        run: .venv/bin/pytest -q --ignore=tests/test_agnes_execution_kernel_phase2.py --ignore=tests/test_agnes_execution_kernel_phase3.py
      - name: Exact-tree external evidence
        shell: bash
        run: |
          m=$(git ls-tree -r HEAD -- creator_app services tests scripts main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          .venv/bin/python - "$m" <<'PY'
          import json,sys
          m=sys.argv[1]
          q5=json.load(open('evidence/Q05_MULTILANE.json',encoding='utf-8'))
          q8=json.load(open('evidence/Q08_LIVE.json',encoding='utf-8'))
          assert m==q5['subject_manifest_sha256']==q8['source_subject_manifest_sha256']
          assert q5['result']=='PASS' and q5['tests_passed']==17 and q5['tests_failed']==0
          assert q8['result']=='PASS' and q8['redis_live']=='PASS' and q8['postgresql_live']=='PASS'
          print('Q05/Q08 evidence PASS')
          PY
