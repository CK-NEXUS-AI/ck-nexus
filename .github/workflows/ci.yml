name: CK-NEXUS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,billing,email,github-app]'
      - name: Compile
        run: python -m compileall -q main.py creator_app services scripts
      - name: Ruff
        run: ruff check main.py creator_app services tests scripts
      - name: Bandit
        run: bandit -q -r creator_app services main.py
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Tests
        run: pytest -q
