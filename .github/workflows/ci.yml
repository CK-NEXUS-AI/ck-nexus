name: CK-NEXUS CI

on:
  push:
    branches: [main, verify/q04-q05-converged]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Q04 lock check
        run: uv lock --check

      - name: Q04 frozen sync
        run: uv sync --all-extras --dev --frozen

      - name: Q04 runtime import smoke
        run: .venv/bin/python -c "import aiosqlite, asyncpg, psycopg, redis; print('Q04 runtime imports PASS')"

      - name: Compile
        run: .venv/bin/python -m compileall -q main.py creator_app services scripts

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: .venv/bin/ruff check main.py creator_app services tests scripts --output-format=github

      - name: Bandit diagnostics and exact reviewed gate
        id: bandit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          .venv/bin/bandit -r creator_app services main.py -f json -o bandit.json
          diagnostic_rc=$?
          set -e
          cat bandit.json
          echo "Bandit all-severity diagnostic exit=$diagnostic_rc"
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          import sys

          report = json.load(open("bandit.json", encoding="utf-8"))
          reviewed = {
              (
                  "B608",
                  "services/email_gateway/repository.py",
                  221,
                  "a248369faca360edbca232b1700ef67d87d9eeae8401bb1b379122f3274a4a6a",
              ),
              (
                  "B608",
                  "services/email_gateway/repository.py",
                  230,
                  "2948e929a8c5a30e600e2d06c3cea59da396aa196adfd234183556d877df3de0",
              ),
          }
          blocking = []
          accepted = []
          for result in report.get("results", []):
              if result.get("issue_severity") not in {"MEDIUM", "HIGH"}:
                  continue
              fingerprint = (
                  result.get("test_id"),
                  result.get("filename"),
                  result.get("line_number"),
                  hashlib.sha256(result.get("code", "").encode()).hexdigest(),
              )
              if fingerprint in reviewed:
                  accepted.append(fingerprint)
              else:
                  blocking.append(fingerprint)
          print(f"Reviewed exact Bandit findings accepted: {len(accepted)}")
          if blocking:
              print("Blocking MEDIUM/HIGH Bandit findings:")
              for item in blocking:
                  print(item)
              sys.exit(1)
          PY

      - name: Secret scan
        id: secret_scan
        continue-on-error: true
        run: .venv/bin/python scripts/secret_scan.py

      - name: Tests
        id: tests
        continue-on-error: true
        run: .venv/bin/pytest -q

      - name: Upload Q05 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q05-diagnostics
          path: bandit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Q05 final gate
        if: always()
        shell: bash
        env:
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          SECRET_OUTCOME: ${{ steps.secret_scan.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          printf 'Ruff=%s\nBandit=%s\nSecretScan=%s\nTests=%s\n' \
            "$RUFF_OUTCOME" "$BANDIT_OUTCOME" "$SECRET_OUTCOME" "$TESTS_OUTCOME"
          test "$RUFF_OUTCOME" = success
          test "$BANDIT_OUTCOME" = success
          test "$SECRET_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
