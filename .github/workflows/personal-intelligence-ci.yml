name: Personal Intelligence Post-P0 CI

on:
  pull_request:
    paths:
      - 'creator_app/personal_intelligence/**'
      - '.github/workflows/personal-intelligence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Personal intelligence tests
        run: .venv/bin/pytest -q creator_app/personal_intelligence/tests
      - name: Ruff
        run: .venv/bin/ruff check creator_app/personal_intelligence --output-format=github
      - name: Bandit gate
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/bandit -r creator_app/personal_intelligence -f json -o /tmp/pi-bandit.json || true
          .venv/bin/python - <<'PY'
          import json
          import sys
          report = json.load(open('/tmp/pi-bandit.json', encoding='utf-8'))
          blocking = [x for x in report.get('results', []) if x.get('issue_severity') in {'MEDIUM', 'HIGH'}]
          print(f'blocking_findings={len(blocking)}')
          sys.exit(bool(blocking))
          PY
      - name: Secret scan
        run: .venv/bin/python scripts/secret_scan.py
      - name: Privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'active consent required' creator_app/personal_intelligence/consent.py
          grep -q 'sensitive attributes are not inferred' creator_app/personal_intelligence/profile.py
          grep -q 'raw_content_stored: bool = False' creator_app/personal_intelligence/audit.py
          grep -q 'transparent_ai: bool = True' creator_app/personal_intelligence/persona.py
          grep -q 'claim_real_emotions: bool = False' creator_app/personal_intelligence/persona.py
      - name: Production boundary
        run: |
          echo 'Personal Intelligence V1 is Post-P0 development infrastructure.'
          echo 'It does not authorize Gmail access by itself.'
          echo 'It cannot satisfy Q10/Q11/Q12 or authorize PR #14 merge.'
          echo 'Production remains NO-GO.'
