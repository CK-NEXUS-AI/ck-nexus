name: Candidate automated gates

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate commit SHA; defaults to this workflow's commit
        required: false
        type: string
      q16_run_id:
        description: Successful Q16 production-image workflow run for this exact candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  q13_postgres_dr:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cknexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cknexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      CKNEXUS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cknexus
      CKNEXUS_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cknexus_restore_dr
      CKNEXUS_ENVIRONMENT: staging
      CKNEXUS_RESTORE_TARGET_CLASS: isolated-dr
      CKNEXUS_ALLOW_DESTRUCTIVE_RESTORE: YES
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Resolve exact candidate identity
        id: subject
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          target_sha="${REQUESTED_TARGET_SHA:-$GITHUB_SHA}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$target_sha" = "$GITHUB_SHA" || { echo "target_sha_must_match_dispatch_head" >&2; exit 1; }
          if ! git cat-file -e "$target_sha^{commit}" 2>/dev/null; then git fetch --no-tags origin "$target_sha"; fi
          git checkout --detach "$target_sha"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Ensure PostgreSQL client tools
        run: |
          if ! command -v pg_dump >/dev/null || ! command -v pg_restore >/dev/null || ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Seed isolated staging source and restore target
        run: |
          psql "$CKNEXUS_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE agnes_idempotency (id integer primary key, payload text);
          CREATE TABLE creator_runs (id integer primary key, payload text);
          CREATE TABLE email_journal (id integer primary key, payload text);
          CREATE TABLE email_outbox (id integer primary key, payload text);
          INSERT INTO creator_runs VALUES (1, 'q13-sentinel');
          SQL
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE cknexus_restore_dr;'
      - name: Run destructive isolated DR gate
        run: |
          python3 scripts/gate_postgres_dr.py | tee Q13_POSTGRES_DR.json
          python3 - <<'PY'
          import json
          x=json.load(open('Q13_POSTGRES_DR.json'))
          assert x['status']=='PASS' and x['backup']=='completed' and x['restore']=='completed'
          PY
          test "$(psql "$CKNEXUS_RESTORE_DATABASE_URL" -Atqc "select payload from creator_runs where id=1")" = "q13-sentinel"
      - name: Bind Q13 evidence to candidate identity
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ steps.subject.outputs.target_sha }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          subject=$(git ls-tree -r HEAD -- app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          python3 - "$HEAD_SHA" "$tree" "$subject" "$RUN_ID" <<'PY'
          import json,sys
          sha,tree,subject,run_id=sys.argv[1:]
          raw=json.load(open('Q13_POSTGRES_DR.json'))
          passed=(raw.get('status')=='PASS' and raw.get('backup')=='completed' and raw.get('restore')=='completed')
          raw.update({
              'schema_version':2,
              'gate':'Q13',
              'source_sha':sha,
              'source_tree':tree,
              'release_subject_manifest_sha256':subject,
              'github_run_id':int(run_id),
              'environment_class':'ephemeral-isolated-staging',
              'production_data_used':False,
              'sentinel_round_trip':'PASS' if passed else 'FAIL',
              'result':'PASS' if passed else 'FAIL',
              'production_promotion_allowed':passed,
          })
          json.dump(raw,open('Q13_POSTGRES_DR.json','w'),indent=2,sort_keys=True)
          open('Q13_POSTGRES_DR.json','a').write('\n')
          print(json.dumps(raw,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q13-postgres-dr-${{ steps.subject.outputs.target_sha }}
          path: Q13_POSTGRES_DR.json
          if-no-files-found: error

  q15_clean_machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Resolve exact candidate identity
        id: subject
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          target_sha="${REQUESTED_TARGET_SHA:-$GITHUB_SHA}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$target_sha" = "$GITHUB_SHA" || { echo "target_sha_must_match_dispatch_head" >&2; exit 1; }
          if ! git cat-file -e "$target_sha^{commit}" 2>/dev/null; then git fetch --no-tags origin "$target_sha"; fi
          git checkout --detach "$target_sha"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Install exact Q16 production image artifact
        id: production_image
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.subject.outputs.target_sha }}
          Q16_RUN_ID: ${{ inputs.q16_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q16-image"
          run_meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$Q16_RUN_ID")
          python3 - "$run_meta" "$TARGET_SHA" <<'PY'
          import json,sys
          run=json.loads(sys.argv[1])
          assert run['head_sha']==sys.argv[2], 'Q16 run head does not match candidate SHA'
          assert run['conclusion']=='success', 'Q16 image workflow did not succeed'
          assert run['event']=='workflow_dispatch', 'Q16 image must be an explicit candidate run'
          assert run['path']=='.github/workflows/candidate-production-image.yml', 'Q16 run came from an unexpected workflow path'
          assert run['name']=='Candidate production image'
          PY
          gh run download "$Q16_RUN_ID" --name "q16-production-image-$TARGET_SHA" --dir "$RUNNER_TEMP/q16-image"
          python3 - "$RUNNER_TEMP/q16-image" "$TARGET_SHA" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          evidence=json.loads((root/'Q16_PRODUCTION_IMAGE.json').read_text(encoding='utf-8'))
          assert evidence['source_sha']==sys.argv[2]
          assert evidence['result']=='PASS' and evidence['production_promotion_allowed'] is True
          assert evidence['image_scan_status']=='PASS'
          assert hashlib.sha256((root/'q16-production-image.tar.gz').read_bytes()).hexdigest()==evidence['image_archive_sha256']
          assert hashlib.sha256((root/'trivy-image.json').read_bytes()).hexdigest()==evidence['image_scan_report_sha256']
          assert hashlib.sha256((root/'trivy-image-full.json').read_bytes()).hexdigest()==evidence['image_scan_full_report_sha256']
          PY
          docker load -i "$RUNNER_TEMP/q16-image/q16-production-image.tar.gz"
          docker image inspect "cknexus-candidate:$TARGET_SHA" >/dev/null
          echo "artifact_sha=$(sha256sum "$RUNNER_TEMP/q16-image/q16-production-image.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Fresh-host install
        shell: bash
        run: |
          start=$(date +%s)
          echo "Q15_INSTALL_STARTED=$start" >> "$GITHUB_ENV"
          python3 -m pip install --upgrade pip "uv==0.13.7"
          uv lock --check
          uv sync --all-extras --dev --frozen
          .venv/bin/python3 -m compileall -q main.py creator_app services scripts
          .venv/bin/ruff check main.py creator_app services tests scripts
      - name: Run portable regression suite
        id: portable
        shell: bash
        run: |
          set -o pipefail
          set +e
          .venv/bin/pytest -q --ignore=tests/test_agnes_execution_kernel_phase2.py --ignore=tests/test_agnes_execution_kernel_phase3.py | tee q15-portable-tests.log
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then touch q15-portable-regression.pass; fi
          exit 0
      - name: Run Phase 2 Linux namespace isolation regression
        id: phase2
        shell: bash
        run: |
          set -o pipefail
          set +e
          # Execute as the hosted runner identity, matching the non-root production service boundary.
          .venv/bin/pytest -q tests/test_agnes_execution_kernel_phase2.py | tee q15-phase2-tests.log
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then touch q15-phase2-regression.pass; fi
          exit 0
      - name: Run Phase 3 autonomous pipeline regression
        id: phase3
        shell: bash
        run: |
          set -o pipefail
          set +e
          # Execute Phase 3 kernel namespace/seccomp assertions as the non-root runner identity.
          .venv/bin/pytest -q tests/test_agnes_execution_kernel_phase3.py | tee q15-phase3-tests.log
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then touch q15-phase3-regression.pass; fi
          exit 0
      - name: Unified runtime smoke
        shell: bash
        env:
          CKNEXUS_MOCK_AI: 'true'
          CKNEXUS_HOST: 127.0.0.1
          PORT: '8000'
        run: |
          ./start_unified.sh > q15-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          echo "$server_pid" > q15-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > q15-health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/control > q15-control.html
          curl -fsS http://127.0.0.1:8000/api/control/manifest > q15-control-manifest.json
          .venv/bin/python3 - <<'PY'
          import json
          h=json.load(open('q15-health.json'))
          m=json.load(open('q15-control-manifest.json'))
          assert h['status']=='ok'
          assert m['name']=='CK-NEXUS Unified Control Surface'
          assert m['route_count'] > 0 and len(m['groups']) == 8
          assert 'CK-NEXUS' in open('q15-control.html',encoding='utf-8').read()
          PY
          kill "$(cat q15-server.pid)" || true
      - name: Run exact production image on clean host as non-root
        id: production_runtime
        if: always()
        env:
          TARGET_SHA: ${{ steps.subject.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name q15-production-image -p 18000:8000 \
            -e CKNEXUS_MOCK_AI=true -e CKNEXUS_HOST=0.0.0.0 -e PORT=8000 \
            "cknexus-candidate:$TARGET_SHA" >/dev/null
          trap 'docker rm -f q15-production-image >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18000/health > q15-image-health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/api/control/manifest > q15-image-control-manifest.json
          runtime_uid=$(docker exec q15-production-image id -u)
          test "$runtime_uid" -ne 0
          docker inspect --format '{{.Config.User}}' q15-production-image > q15-image-user.txt
          python3 - <<'PY'
          import json
          h=json.load(open('q15-image-health.json',encoding='utf-8'))
          m=json.load(open('q15-image-control-manifest.json',encoding='utf-8'))
          assert h['status']=='ok'
          assert m['name']=='CK-NEXUS Unified Control Surface'
          assert m['route_count']>0 and len(m['groups'])==8
          PY
          python3 - "$runtime_uid" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('q15-production-image-smoke.json')
          p.write_text(json.dumps({'result':'PASS','runtime_uid':int(sys.argv[1]),'runtime_user':Path('q15-image-user.txt').read_text().strip(),'health':'PASS','control':'PASS'},indent=2,sort_keys=True)+'\n')
          PY
          echo "rc=0" >> "$GITHUB_OUTPUT"
      - name: Emit clean-machine evidence
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ steps.subject.outputs.target_sha }}
          IMAGE_OS: ${{ env.ImageOS }}
          IMAGE_VERSION: ${{ env.ImageVersion }}
          PORTABLE_RC: ${{ steps.portable.outputs.rc }}
          PHASE2_RC: ${{ steps.phase2.outputs.rc }}
          PHASE3_RC: ${{ steps.phase3.outputs.rc }}
          PRODUCTION_IMAGE_RC: ${{ steps.production_runtime.outputs.rc }}
          PRODUCTION_IMAGE_SHA256: ${{ steps.production_image.outputs.artifact_sha }}
        run: |
          finish=$(date +%s)
          duration=$((finish-Q15_INSTALL_STARTED))
          tree=$(git rev-parse HEAD^{tree})
          subject=$(git ls-tree -r HEAD -- app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          python3 - "$HEAD_SHA" "$tree" "$subject" "$RUN_ID" "$duration" <<'PY'
          import json,os,platform,sys
          from pathlib import Path
          sha,tree,subject,run_id,duration=sys.argv[1:]
          portable=Path('q15-portable-regression.pass').exists() and os.getenv('PORTABLE_RC')=='0'
          phase2=Path('q15-phase2-regression.pass').exists() and os.getenv('PHASE2_RC')=='0'
          phase3=Path('q15-phase3-regression.pass').exists() and os.getenv('PHASE3_RC')=='0'
          try:
              health=json.load(open('q15-health.json',encoding='utf-8')).get('status')=='ok'
              manifest=json.load(open('q15-control-manifest.json',encoding='utf-8'))
              control=manifest.get('name')=='CK-NEXUS Unified Control Surface' and len(manifest.get('groups',[]))==8 and manifest.get('route_count',0)>0
          except (OSError,json.JSONDecodeError):
              health=control=False
          try:
              image_smoke=json.load(open('q15-production-image-smoke.json',encoding='utf-8'))
              image_installed=image_smoke.get('result')=='PASS' and image_smoke.get('runtime_uid',0)>0
          except (OSError,json.JSONDecodeError):
              image_installed=False
          passed=portable and phase2 and phase3 and health and control and image_installed and os.getenv('PRODUCTION_IMAGE_RC')=='0'
          evidence={
              'schema_version':2,
              'gate':'Q15',
              'source_sha':sha,
              'source_tree':tree,
              'release_subject_manifest_sha256':subject,
              'github_run_id':int(run_id),
              'host_class':'fresh-github-hosted-vm',
              'os':platform.platform(),
              'runner_name':os.getenv('RUNNER_NAME'),
              'image_os':os.getenv('ImageOS'),
              'image_version':os.getenv('ImageVersion'),
              'install':'uv sync --all-extras --dev --frozen',
              'portable_regression':'PASS' if portable else 'FAIL',
              'phase2_sandbox_regression':'PASS' if phase2 else 'FAIL',
              'phase3_pipeline_regression':'PASS' if phase3 else 'FAIL',
              'unified_health_smoke':'PASS' if health else 'FAIL',
              'unified_control_smoke':'PASS' if control else 'FAIL',
              'exact_q16_production_image_installation':'PASS' if image_installed else 'FAIL',
              'production_image_artifact_sha256':os.getenv('PRODUCTION_IMAGE_SHA256'),
              'elapsed_seconds':int(duration),
              'test_exit_codes':{'portable':os.getenv('PORTABLE_RC'),'phase2':os.getenv('PHASE2_RC'),'phase3':os.getenv('PHASE3_RC')},
              'result':'PASS' if passed else 'FAIL',
              'production_promotion_allowed':passed,
              'supported_production_host_verified':'Linux Ubuntu 24.04',
          }
          json.dump(evidence,open('Q15_CLEAN_MACHINE.json','w'),indent=2,sort_keys=True)
          open('Q15_CLEAN_MACHINE.json','a').write('\n')
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q15-clean-machine-${{ steps.subject.outputs.target_sha }}
          path: |
            Q15_CLEAN_MACHINE.json
            q15-health.json
            q15-control-manifest.json
            q15-server.log
            q15-portable-tests.log
            q15-phase2-tests.log
            q15-phase3-tests.log
            q15-production-image-smoke.json
            q15-image-health.json
            q15-image-control-manifest.json
            q15-image-user.txt
          if-no-files-found: warn
      - name: Enforce Q15
        if: always()
        run: python3 -c "import json; x=json.load(open('Q15_CLEAN_MACHINE.json')); assert x['result']=='PASS' and x['production_promotion_allowed'] is True"
