name: PR47 Bandit B310 Hardening

on:
  push:
    branches:
      - fix/pr46-cknexus-ci-ruff-v1

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply HTTPS and known-endpoint validation
        run: |
          python - <<'PY'
          from pathlib import Path

          free = Path('creator_app/free_providers.py')
          text = free.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Any\nfrom urllib.request import Request, urlopen\n',
              'from typing import Any\nfrom urllib.parse import urlparse\nfrom urllib.request import Request, urlopen\n',
          )
          marker = '# ── Quota Tracker ────────────────────────────────────────────────────────────\n'
          helper = '''def _require_https_url(url: str) -> None:\n    parsed = urlparse(url)\n    if parsed.scheme != "https" or not parsed.hostname:\n        raise ValueError("Provider endpoint must use HTTPS with a valid hostname")\n\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              '        self.name = name\n        self.base_url = base_url.rstrip("/")\n',
              '        self.name = name\n        _require_https_url(base_url)\n        self.base_url = base_url.rstrip("/")\n',
              1,
          )
          text = text.replace(
              '                with urlopen(request, timeout=self.timeout_seconds) as response:\n',
              '                with urlopen(request, timeout=self.timeout_seconds) as response:  # nosec B310 -- HTTPS URL validated before request construction.\n',
              1,
          )
          gemini_anchor = '        payload = json.dumps(\n'
          gemini_pos = text.find('class GeminiAdapter:')
          if gemini_pos != -1:
              payload_pos = text.find(gemini_anchor, gemini_pos)
              if payload_pos != -1 and '_require_https_url(url)' not in text[gemini_pos:payload_pos]:
                  text = text[:payload_pos] + '        _require_https_url(url)\n' + text[payload_pos:]
          first = text.find('# nosec B310')
          second_urlopen = text.find('with urlopen(request, timeout=self.timeout_seconds) as response:', first + 1)
          if second_urlopen != -1:
              line_end = text.find('\n', second_urlopen)
              line = text[second_urlopen:line_end]
              if '# nosec B310' not in line:
                  text = text[:line_end] + '  # nosec B310 -- fixed Gemini HTTPS endpoint validated above.' + text[line_end:]
          free.write_text(text, encoding='utf-8')

          hub = Path('creator_app/provider_hub.py')
          text = hub.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Any\nfrom urllib.request import Request, urlopen\n',
              'from typing import Any\nfrom urllib.parse import urlparse\nfrom urllib.request import Request, urlopen\n',
          )
          marker = '\n\ndef _get_key(slug: str) -> str | None:\n'
          helper = '''\n\ndef _require_known_validation_url(url: str) -> None:\n    allowed = {provider.validate_url for provider in PROVIDERS}\n    parsed = urlparse(url)\n    if url not in allowed or parsed.scheme != "https" or not parsed.hostname:\n        raise ValueError("Provider validation URL is not an approved HTTPS endpoint")\n'''
          if '_require_known_validation_url' not in text:
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              '        with urlopen(req, timeout=10) as resp:\n',
              '        with urlopen(req, timeout=10) as resp:  # nosec B310 -- fixed Anthropic HTTPS endpoint.\n',
              1,
          )
          generic_anchor = '        auth_header = header_format.replace("{key}", key)\n'
          if '_require_known_validation_url(validate_url)' not in text:
              text = text.replace(
                  generic_anchor,
                  '        _require_known_validation_url(validate_url)\n' + generic_anchor,
                  1,
              )
          first = text.find('# nosec B310')
          second = text.find('with urlopen(req, timeout=10) as resp:', first + 1)
          if second != -1:
              line_end = text.find('\n', second)
              line = text[second:line_end]
              if '# nosec B310' not in line:
                  text = text[:line_end] + '  # nosec B310 -- approved HTTPS validation URL enforced above.' + text[line_end:]
          hub.write_text(text, encoding='utf-8')
          PY
      - name: Verify lint and Bandit
        run: |
          python -m pip install --upgrade pip uv
          uv sync --all-extras --dev --frozen
          .venv/bin/ruff check creator_app/free_providers.py creator_app/provider_hub.py --fix
          .venv/bin/ruff format creator_app/free_providers.py creator_app/provider_hub.py
          .venv/bin/ruff check creator_app/free_providers.py creator_app/provider_hub.py
          .venv/bin/bandit -q creator_app/free_providers.py creator_app/provider_hub.py
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "No hardening changes"
            exit 0
          fi
          git config user.name "ck-nexus-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator_app/free_providers.py creator_app/provider_hub.py
          git commit -m "security: validate provider URLs before urllib access"
          git push origin HEAD:fix/pr46-cknexus-ci-ruff-v1
