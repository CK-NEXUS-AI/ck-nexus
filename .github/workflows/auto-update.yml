name: CK-NEXUS auto-update gate progress

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  render:
    name: Render report and propose documentation update
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: auto-update-gate-progress-render
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Generate update report from trusted main
        shell: bash
        run: |
          set -euo pipefail
          echo "Generator source: trusted main at $(git rev-parse HEAD)"
          python3 scripts/generate_update_report.py
          python3 scripts/render_badge.py
          mkdir -p "$RUNNER_TEMP/generated"
          cp docs/UPDATE_REPORT.md "$RUNNER_TEMP/generated/UPDATE_REPORT.md"
          mkdir -p "$RUNNER_TEMP/generated/badges"
          cp docs/badges/security.svg docs/badges/stability.svg docs/badges/release.svg docs/badges/delivery.svg "$RUNNER_TEMP/generated/badges/"

      - name: Prepare automation branch without overwriting remote history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin automation/gate-progress >/dev/null 2>&1; then
            git fetch origin automation/gate-progress
            git checkout -B automation/gate-progress FETCH_HEAD
            if ! git merge --no-edit origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ -z "$conflicts" ]]; then
                echo "Merge failed without an inspectable conflict list."
                exit 1
              fi
              while IFS= read -r conflict; do
                case "$conflict" in
                  docs/UPDATE_REPORT.md|docs/badges/security.svg|docs/badges/stability.svg|docs/badges/release.svg|docs/badges/delivery.svg)
                    git checkout --theirs -- "$conflict"
                    git add "$conflict"
                    ;;
                  *)
                    echo "Unexpected merge conflict outside generated artifacts: $conflict"
                    exit 1
                    ;;
                esac
              done <<< "$conflicts"
              GIT_EDITOR=true git merge --continue
            fi
          else
            git checkout -b automation/gate-progress origin/main
          fi

      - name: Copy artifacts generated by trusted main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/badges
          cp "$RUNNER_TEMP/generated/UPDATE_REPORT.md" docs/UPDATE_REPORT.md
          cp "$RUNNER_TEMP/generated/badges/security.svg" docs/badges/security.svg
          cp "$RUNNER_TEMP/generated/badges/stability.svg" docs/badges/stability.svg
          cp "$RUNNER_TEMP/generated/badges/release.svg" docs/badges/release.svg
          cp "$RUNNER_TEMP/generated/badges/delivery.svg" docs/badges/delivery.svg

      - name: Commit and push documentation-only branch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UPDATE_REPORT.md docs/badges/security.svg docs/badges/stability.svg docs/badges/release.svg docs/badges/delivery.svg
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated artifact changes; no push."
            exit 0
          fi
          git commit -m "docs: refresh gate status [skip ci]"
          git push origin HEAD:refs/heads/automation/gate-progress
          echo "changed=true" >> "$GITHUB_OUTPUT"

  create-pr:
    name: Create or locate documentation PR
    needs: render
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      branch_ahead: ${{ steps.compare.outputs.branch_ahead }}
      pull_number: ${{ steps.pr.outputs.pull_number }}
    steps:
      - name: Checkout trusted main metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check whether automation branch is ahead
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git ls-remote --exit-code --heads origin automation/gate-progress >/dev/null 2>&1; then
            echo "branch_ahead=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin automation/gate-progress
          ahead="$(git rev-list --count origin/main..FETCH_HEAD)"
          if [[ "$ahead" -gt 0 ]]; then
            files="$(git diff --name-only origin/main...FETCH_HEAD)"
            if [[ -z "$files" ]]; then
              ahead=0
            else
              while IFS= read -r path; do
                case "$path" in
                  docs/UPDATE_REPORT.md|docs/badges/security.svg|docs/badges/stability.svg|docs/badges/release.svg|docs/badges/delivery.svg)
                    ;;
                  *)
                    echo "Unexpected non-generated path in automation branch: $path"
                    exit 1
                    ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "branch_ahead=$ahead" >> "$GITHUB_OUTPUT"

      - name: Create or locate documentation PR
        id: pr
        if: ${{ steps.compare.outputs.branch_ahead != '0' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = owner + ":automation/gate-progress";
            const existing = await github.rest.pulls.list({
              owner, repo, state: "open", head, base: "main"
            });
            if (existing.data.length > 0) {
              core.setOutput("pull_number", String(existing.data[0].number));
              return;
            }
            const created = await github.rest.pulls.create({
              owner,
              repo,
              head: "automation/gate-progress",
              base: "main",
              title: "docs: refresh evidence-derived gate status",
              body: [
                "## Automated documentation update",
                "",
                "- Refreshes the Q10–Q16 status report from committed evidence JSON.",
                "- Regenerates four status-aware SVG badges.",
                "- Uses generator code from the protected main revision.",
                "- Does not edit evidence, release subjects, Core Authority, or secrets.",
                "- Does not merge or deploy; normal review and branch protection remain in force.",
                "",
                "FAIL, BLOCKED, NOT_VERIFIED, and UNKNOWN are labels, not fabricated percentages.",
                "The release decision remains NO-GO unless independently changed through the release process."
              ].join("\n")
            });
            core.setOutput("pull_number", String(created.data.number));

  lint-workflow:
    name: Lint workflow on pull requests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: auto-update-gate-progress-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install workflow validators
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check yamllint

      - name: Lint workflow syntax
        run: |
          set -euo pipefail
          actionlint .github/workflows/auto-update.yml
          yamllint -d relaxed .github/workflows/auto-update.yml

  verify-docs:
    name: Verify generated artifacts with trusted main code
    needs: [render, create-pr]
    if: ${{ needs.create-pr.outputs.branch_ahead != '0' && needs.create-pr.outputs.pull_number != '0' && needs.create-pr.outputs.pull_number != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Fetch automation branch as data only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/gate-progress
          git worktree add "$RUNNER_TEMP/automation" FETCH_HEAD

      - name: Run focused tests from trusted main
        run: python3 -m unittest discover -s tests -p 'test_update_report_badges.py' -v

      - name: Verify artifacts against trusted main generator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_update_report.py
          python3 scripts/render_badge.py
          for path in docs/UPDATE_REPORT.md docs/badges/security.svg docs/badges/stability.svg docs/badges/release.svg docs/badges/delivery.svg; do
            if ! cmp -s "$path" "$RUNNER_TEMP/automation/$path"; then
              echo "Generated artifact differs from automation branch: $path"
              exit 1
            fi
          done
