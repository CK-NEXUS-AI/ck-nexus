name: Docker Security Toolbox Repair 2026-09-04

on:
  push:
    branches:
      - ops/canonical-export-20260904
    paths:
      - .github/workflows/docker-security-toolbox-repair-20260904.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: b4146db8e23dff49520cbbc9d0194a15bcc5872d
  SUBJECT_TREE: 25d9c74db2b553667ad085172f8ac7beff4146aa

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - name: Verify exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
      - name: Run Gitleaks and capture redacted evidence
        continue-on-error: true
        run: |
          set +e
          mkdir -p evidence
          chmod 0777 evidence
          IMAGE=ghcr.io/zricethezav/gitleaks:latest
          docker pull "$IMAGE" > evidence/pull.txt 2>&1
          pull_rc=$?
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > evidence/image-digest.json 2>&1
          inspect_rc=$?
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/evidence:/out" "$IMAGE" detect --source /repo --report-format json --report-path /out/gitleaks.json --redact --no-banner > evidence/stdout.txt 2> evidence/stderr.txt
          scan_rc=$?
          docker run --rm "$IMAGE" version > evidence/version.txt 2>&1
          version_rc=$?
          printf 'pull_rc=%s\ninspect_rc=%s\nscan_rc=%s\nversion_rc=%s\n' "$pull_rc" "$inspect_rc" "$scan_rc" "$version_rc" > evidence/exit-codes.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-helper-gitleaks-repair
          path: evidence/
          if-no-files-found: warn

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - name: Verify exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
      - name: Run ShellCheck and capture evidence
        continue-on-error: true
        run: |
          set +e
          mkdir -p evidence
          IMAGE=koalaman/shellcheck:stable
          docker pull "$IMAGE" > evidence/pull.txt 2>&1
          pull_rc=$?
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > evidence/image-digest.json 2>&1
          inspect_rc=$?
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          printf '%s\n' "${files[@]}" > evidence/files.txt
          if ((${#files[@]})); then
            args=()
            for f in "${files[@]}"; do args+=("/mnt/${f#./}"); done
            docker run --rm -v "$PWD:/mnt:ro" "$IMAGE" "${args[@]}" > evidence/shellcheck.txt 2>&1
            scan_rc=$?
          else
            scan_rc=0
          fi
          docker run --rm "$IMAGE" --version > evidence/version.txt 2>&1
          version_rc=$?
          printf 'pull_rc=%s\ninspect_rc=%s\nscan_rc=%s\nversion_rc=%s\n' "$pull_rc" "$inspect_rc" "$scan_rc" "$version_rc" > evidence/exit-codes.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-helper-shellcheck-repair
          path: evidence/
          if-no-files-found: warn

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - name: Verify exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
      - name: Run Hadolint and capture evidence
        continue-on-error: true
        run: |
          set +e
          mkdir -p evidence
          IMAGE=hadolint/hadolint:latest-debian
          docker pull "$IMAGE" > evidence/pull.txt 2>&1
          pull_rc=$?
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > evidence/image-digest.json 2>&1
          inspect_rc=$?
          mapfile -t files < <(find . -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \) -not -path './.git/*' | sort)
          printf '%s\n' "${files[@]}" > evidence/files.txt
          if ((${#files[@]})); then
            args=()
            for f in "${files[@]}"; do args+=("/src/${f#./}"); done
            docker run --rm -v "$PWD:/src:ro" "$IMAGE" hadolint "${args[@]}" > evidence/hadolint.txt 2>&1
            scan_rc=$?
          else
            scan_rc=0
          fi
          docker run --rm "$IMAGE" hadolint --version > evidence/version.txt 2>&1
          version_rc=$?
          printf 'pull_rc=%s\ninspect_rc=%s\nscan_rc=%s\nversion_rc=%s\n' "$pull_rc" "$inspect_rc" "$scan_rc" "$version_rc" > evidence/exit-codes.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-helper-hadolint-repair
          path: evidence/
          if-no-files-found: warn
