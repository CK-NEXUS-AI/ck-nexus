name: Candidate runtime subject

on:
  push:
    branches: [fix/connector-snapshot-serialization-v2]
  pull_request:
    branches: [release/q10-q16-closure]
    paths:
      - 'app/**'
      - 'creator_app/**'
      - 'services/**'
      - 'gateway/**'
      - 'orchestration/**'
      - 'idea_engine/**'
      - 'migrations/**'
      - 'deploy/**'
      - 'observability/**'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - 'main.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/release_subject.py'
      - 'tests/test_release_subject.py'
      - '.github/workflows/runtime-subject-candidate.yml'

permissions:
  contents: read

jobs:
  subject:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Compute runtime subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          subject=$(python scripts/release_subject.py --scope runtime --ref HEAD)
          tree=$(git rev-parse HEAD^{tree})
          printf 'subject=%s\n' "$subject" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$subject" > runtime-subject.txt
          printf '{"schema_version":1,"head_sha":"%s","tree_sha":"%s","runtime_subject_sha256":"%s"}\n' "$GITHUB_SHA" "$tree" "$subject" > runtime-subject.json
          cat runtime-subject.json
      - name: Upload subject evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-subject-${{ github.sha }}
          path: |
            runtime-subject.txt
            runtime-subject.json
          if-no-files-found: error
