name: Candidate production image

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate commit SHA; defaults to this workflow's commit
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  docker_image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Resolve exact candidate identity
        id: subject
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          target_sha="${REQUESTED_TARGET_SHA:-$GITHUB_SHA}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$target_sha" = "$GITHUB_SHA" || { echo "target_sha_must_match_dispatch_head" >&2; exit 1; }
          if ! git cat-file -e "$target_sha^{commit}" 2>/dev/null; then git fetch --no-tags origin "$target_sha"; fi
          git checkout --detach "$target_sha"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Validate Compose fail-closed Phase3 default
        run: |
          grep -F 'CKNEXUS_AGNES_PHASE3_ENABLED: $' docker-compose.prod.yml >/dev/null
          grep -F '{CKNEXUS_AGNES_PHASE3_ENABLED:-false}' docker-compose.prod.yml >/dev/null
      - name: Validate frozen production install contract
        run: |
          grep -Fx 'FROM python:3.12.16-slim-trixie@sha256:e695ab189fa2d082b1c61c69a6b888a5adeca61ceeccad107b1ed2a125721a9e AS builder' Dockerfile
          grep -Fx 'FROM python:3.12.16-slim-trixie@sha256:e695ab189fa2d082b1c61c69a6b888a5adeca61ceeccad107b1ed2a125721a9e AS runtime' Dockerfile
          grep -F 'pip==26.3 setuptools==84.2.1 uv==0.13.7' Dockerfile
          grep -F 'uv pip check --python /app/.venv/bin/python' Dockerfile
          grep -F 'COPY --from=builder --chown=10001:10001 /app /app' Dockerfile
          grep -F 'COPY pyproject.toml uv.lock README.md ./' Dockerfile
          grep -F 'uv lock --check' Dockerfile
          grep -F 'uv sync --frozen --no-dev --no-editable' Dockerfile
      - name: Build production image
        run: docker build --pull -t cknexus-candidate:${{ steps.subject.outputs.target_sha }} .
      - name: Install pinned Trivy scanner
        run: bash scripts/install_trivy_ci.sh
      - name: Scan the built production image (full and policy-filtered)
        env:
          TARGET_SHA: ${{ steps.subject.outputs.target_sha }}
        shell: bash
        run: |
          set +e
          trivy image --scanners vuln,misconfig --format json --output trivy-image-full.json cknexus-candidate:${TARGET_SHA}
          full_rc=$?
          trivy image --ignore-unfixed --ignorefile .trivyignore.yaml --scanners vuln,misconfig --format json --output trivy-image.json cknexus-candidate:${TARGET_SHA}
          gate_rc=$?
          echo "Q16_TRIVY_FULL_RC=$full_rc" >> "$GITHUB_ENV"
          echo "Q16_TRIVY_RC=$gate_rc" >> "$GITHUB_ENV"
          [ -f trivy-image-full.json ] || printf '{}\n' > trivy-image-full.json
          [ -f trivy-image.json ] || printf '{}\n' > trivy-image.json
          exit 0
      - name: Verify packaged runtime modules and optional dependencies
        run: |
          docker run --rm -i cknexus-candidate:${{ steps.subject.outputs.target_sha }} python3 - <<'PY'
          import importlib.util
          import aiosqlite
          import gateway
          import idea_engine
          import orchestration
          import psycopg
          import redis
          import sqlalchemy
          import stripe
          from creator_app.unified import app
          assert app is not None
          for dev_only in ('pytest','ruff','bandit','pip_audit'):
              assert importlib.util.find_spec(dev_only) is None, dev_only
          print('production image imports PASS; dev-only tooling absent')
          PY
          touch runtime-imports.pass
      - name: Run production image in safe mock mode
        shell: bash
        run: |
          docker run -d --name cknexus-candidate \
            -p 127.0.0.1:18000:8000 \
            -e CKNEXUS_MOCK_AI=true \
            -e CKNEXUS_AGNES_PHASE3_ENABLED=false \
            cknexus-candidate:${{ steps.subject.outputs.target_sha }}
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18000/health > docker-health.json; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/control > docker-control.html
          curl -fsS http://127.0.0.1:18000/api/control/manifest > docker-control-manifest.json
          python3 - <<'PY'
          import json
          h=json.load(open('docker-health.json'))
          m=json.load(open('docker-control-manifest.json'))
          assert h['status']=='ok'
          assert m['name']=='CK-NEXUS Unified Control Surface'
          assert len(m['groups']) == 8 and m['route_count'] > 0
          assert 'CK-NEXUS' in open('docker-control.html',encoding='utf-8').read()
          PY
          touch runtime-smoke.pass
      - name: Verify non-root runtime identity
        run: |
          test "$(docker exec cknexus-candidate id -u)" != "0"
          docker exec cknexus-candidate python3 -c "import os; assert os.geteuid()!=0; print('non-root PASS')"
          touch nonroot.pass
      - name: Export exact scanned production image
        if: always()
        env:
          TARGET_SHA: ${{ steps.subject.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if docker image inspect "cknexus-candidate:${TARGET_SHA}" >/dev/null 2>&1; then
            docker save "cknexus-candidate:${TARGET_SHA}" | gzip -1 > q16-production-image.tar.gz
            sha256sum q16-production-image.tar.gz > q16-production-image.tar.gz.sha256
          fi
      - name: Capture image evidence
        if: always()
        env:
          HEAD_SHA: ${{ steps.subject.outputs.target_sha }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          docker logs cknexus-candidate > docker-server.log 2>&1 || true
          tree=$(git rev-parse HEAD^{tree})
          subject=$(git ls-tree -r HEAD -- app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          image_digest=$(docker image inspect --format '{{.Id}}' "cknexus-candidate:${HEAD_SHA}" 2>/dev/null || true)
          image_archive_sha=$(sha256sum q16-production-image.tar.gz 2>/dev/null | awk '{print $1}' || true)
          python3 - "$HEAD_SHA" "$tree" "$subject" "$RUN_ID" "$image_digest" "$image_archive_sha" <<'PY'
          import hashlib, json, os, shutil, subprocess, sys
          from collections import Counter
          from pathlib import Path
          sha,tree,subject,run_id,image_digest,image_archive_sha=sys.argv[1:]
          imports=Path('runtime-imports.pass').exists()
          smoke=Path('runtime-smoke.pass').exists()
          nonroot=Path('nonroot.pass').exists()
          scan_path=Path('trivy-image.json')
          full_scan_path=Path('trivy-image-full.json')
          scan_rc=int(os.getenv('Q16_TRIVY_RC','127'))
          full_scan_rc=int(os.getenv('Q16_TRIVY_FULL_RC','127'))
          try:
            scan=json.loads(scan_path.read_text(encoding='utf-8'))
          except (OSError,json.JSONDecodeError):
            scan={}
          try:
            full_scan=json.loads(full_scan_path.read_text(encoding='utf-8'))
          except (OSError,json.JSONDecodeError):
            full_scan={}
          counts=Counter()
          full_counts=Counter()
          unfixed_high_critical=set()
          unfixed_high_critical_findings=set()
          unfixed_medium=set()
          unfixed_medium_findings=set()
          listed_but_fixed=set()
          for result in scan.get('Results',[]) or []:
            for item in result.get('Vulnerabilities',[]) or []:
              counts[str(item.get('Severity','UNKNOWN')).upper()]+=1
            for item in result.get('Misconfigurations',[]) or []:
              counts[str(item.get('Severity','UNKNOWN')).upper()]+=1
          for result in full_scan.get('Results',[]) or []:
            for item in result.get('Vulnerabilities',[]) or []:
              severity=str(item.get('Severity','UNKNOWN')).upper()
              full_counts[severity]+=1
              vulnerability_id=str(item.get('VulnerabilityID','UNKNOWN'))
              if severity in ('CRITICAL','HIGH') and not item.get('FixedVersion'):
                unfixed_high_critical.add(vulnerability_id)
                unfixed_high_critical_findings.add(
                  f"{vulnerability_id}|{item.get('PkgName','UNKNOWN')}|{item.get('InstalledVersion','UNKNOWN')}"
                )
              if severity == 'MEDIUM' and not item.get('FixedVersion'):
                unfixed_medium.add(vulnerability_id)
                unfixed_medium_findings.add(
                  f"{vulnerability_id}|{item.get('PkgName','UNKNOWN')}|{item.get('InstalledVersion','UNKNOWN')}"
                )
            for item in result.get('Misconfigurations',[]) or []:
              full_counts[str(item.get('Severity','UNKNOWN')).upper()]+=1
          policy_text=Path('.trivyignore.yaml').read_text(encoding='utf-8') if Path('.trivyignore.yaml').is_file() else ''
          import re
          exception_entries={}
          for block in re.split(r'(?m)^\s*-\s*id:\s*',policy_text)[1:]:
            vulnerability_id=block.splitlines()[0].strip()
            statement_match=re.search(r'(?m)^\s*statement:\s*["\']?(.+?)["\']?\s*$',block)
            expiry_match=re.search(r'(?m)^\s*expired_at:\s*(\d{4}-\d{2}-\d{2})\s*$',block)
            exception_entries[vulnerability_id]=(
              statement_match.group(1).strip().strip('"\'') if statement_match else '',
              expiry_match.group(1) if expiry_match else '',
            )
          exception_ids=set(exception_entries)
          risk_policy=json.loads(Path('security/trivy-risk-acceptance.json').read_text(encoding='utf-8'))
          policy_ids=set(risk_policy.get('vulnerability_ids',[]))
          from datetime import date
          policy_expiry=date.fromisoformat(risk_policy['expires_at'])
          unlisted=unfixed_high_critical-exception_ids
          if exception_ids != unfixed_high_critical:
            unlisted.add('trivy_ignore_set_does_not_exactly_match_unfixed_high_critical_findings')
          if exception_ids != policy_ids:
            unlisted.add('risk_policy_vulnerability_set_mismatch')
          if policy_expiry < date.today():
            unlisted.add('risk_policy_expired')
          if not risk_policy.get('required_owner_review'):
            unlisted.add('risk_policy_owner_review_rationale_missing')
          if risk_policy.get('medium_review_required') is not True or not risk_policy.get('medium_review_mechanism'):
            unlisted.add('risk_policy_medium_review_contract_missing')
          for vulnerability_id,(statement,expiry) in exception_entries.items():
            if not statement or expiry != policy_expiry.isoformat():
              unlisted.add(f'{vulnerability_id}:missing_statement_or_matching_expiry')
          expected_base='python:3.12.16-slim-trixie@sha256:e695ab189fa2d082b1c61c69a6b888a5adeca61ceeccad107b1ed2a125721a9e'
          if risk_policy.get('base_image') != expected_base:
            unlisted.add('risk_policy_base_image_mismatch')
          for result in full_scan.get('Results',[]) or []:
            for item in result.get('Vulnerabilities',[]) or []:
              if str(item.get('VulnerabilityID','UNKNOWN')) in exception_ids and item.get('FixedVersion'):
                listed_but_fixed.add(str(item.get('VulnerabilityID')))
          scan_sha=hashlib.sha256(scan_path.read_bytes()).hexdigest() if scan_path.is_file() else None
          full_scan_sha=hashlib.sha256(full_scan_path.read_bytes()).hexdigest() if full_scan_path.is_file() else None
          from scripts.q16_risk_approval import (
            verify_independent_medium_review,
            verify_owner_risk_approval,
          )
          owner_approval=None
          medium_review=None
          if (unfixed_high_critical or unfixed_medium) and image_digest.startswith('sha256:') and full_scan_sha:
            try:
              release_identity=json.loads(Path('evidence/RELEASE_SUBJECT.json').read_text(encoding='utf-8'))
              pr_number=int(release_identity['release_pr_number'])
              if release_identity.get('owner_github_login') != 'spinlnw10-art':
                raise ValueError('pinned_owner_identity_mismatch')
              pr=json.loads(subprocess.check_output([
                'gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr_number}"
              ],text=True))
              if (
                pr.get('state') != 'open'
                or (pr.get('head') or {}).get('sha') != sha
                or (pr.get('head') or {}).get('ref') != os.environ.get('GITHUB_REF_NAME')
                or (pr.get('base') or {}).get('ref') != 'main'
              ):
                raise ValueError('owner_approval_pr_candidate_mismatch')
              pages=json.loads(subprocess.check_output([
                'gh','api','--paginate','--slurp',
                f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{pr_number}/comments?per_page=100"
              ],text=True))
              comments=[item for page in pages for item in page] if isinstance(pages,list) else []
              if unfixed_high_critical:
                owner_approval=verify_owner_risk_approval(
                  comments,
                  source_sha=sha,
                  base_image=risk_policy["base_image"],
                  image_config_digest=image_digest,
                  report_sha256=full_scan_sha,
                  vulnerability_ids=unfixed_high_critical,
                  finding_refs=unfixed_high_critical_findings,
                )
                if owner_approval and owner_approval['expires_at'] != risk_policy['expires_at']:
                  owner_approval=None
              if unfixed_medium:
                medium_review=verify_independent_medium_review(
                  comments,
                  source_sha=sha,
                  base_image=risk_policy["base_image"],
                  image_config_digest=image_digest,
                  report_sha256=full_scan_sha,
                  vulnerability_ids=unfixed_medium,
                  finding_refs=unfixed_medium_findings,
                )
                if medium_review and medium_review['expires_at'] != risk_policy['expires_at']:
                  medium_review=None
            except (OSError,ValueError,KeyError,TypeError,subprocess.CalledProcessError):
              owner_approval=None
              medium_review=None
          approved=(not unfixed_high_critical) or owner_approval is not None
          medium_reviewed=(not unfixed_medium) or medium_review is not None
          if scan_rc != 0 or full_scan_rc != 0 or not scan or not full_scan:
            image_scan_status='BLOCKED'
          elif counts.get('CRITICAL',0) or counts.get('HIGH',0):
            image_scan_status='FAIL'
          elif unlisted or listed_but_fixed:
            image_scan_status='POLICY_MISMATCH'
          elif unfixed_high_critical and not approved:
            image_scan_status='OWNER_APPROVAL_REQUIRED'
          elif counts.get('MEDIUM',0):
            image_scan_status='FAIL'
          elif unfixed_medium and not medium_reviewed:
            image_scan_status='REVIEW_REQUIRED'
          else:
            image_scan_status='PASS'
          passed=imports and smoke and nonroot and image_scan_status=='PASS' and image_digest.startswith('sha256:') and len(image_archive_sha)==64
          status=lambda ok: 'PASS' if ok else 'FAIL'
          trivy_path=shutil.which('trivy')
          trivy_sha=hashlib.sha256(Path(trivy_path).read_bytes()).hexdigest() if trivy_path else None
          trivy_version=subprocess.run(['trivy','--version'],text=True,capture_output=True,check=False)
          e={
            'schema_version':4,
            'gate':'Q16_PRODUCTION_IMAGE',
            'source_sha':sha,
            'source_tree':tree,
            'release_subject_manifest_sha256':subject,
            'github_run_id':int(run_id),
            'image_config_digest':image_digest or None,
            'image_archive_sha256':image_archive_sha or None,
            'image_scan_status':image_scan_status,
            'image_scan_exit_code':scan_rc,
            'image_scan_full_exit_code':full_scan_rc,
            'image_scan_findings_by_severity':dict(counts),
            'image_scan_full_findings_by_severity':dict(full_counts),
            'image_scan_unfixed_high_critical_ids':sorted(unfixed_high_critical),
            'image_scan_unfixed_high_critical_findings':sorted(unfixed_high_critical_findings),
            'image_scan_unfixed_medium_ids':sorted(unfixed_medium),
            'image_scan_unfixed_medium_findings':sorted(unfixed_medium_findings),
            'image_scan_report_sha256':scan_sha,
            'image_scan_full_report_sha256':full_scan_sha,
            'owner_risk_approval_status':'NOT_REQUIRED' if not unfixed_high_critical else ('APPROVED' if owner_approval else 'PENDING'),
            'owner_risk_approval_actor':owner_approval.get('actor') if owner_approval else None,
            'owner_risk_approval_reference':owner_approval.get('reference') if owner_approval else None,
            'owner_risk_approval_created_at':owner_approval.get('created_at') if owner_approval else None,
            'owner_risk_approval_expires_at':owner_approval.get('expires_at') if owner_approval else None,
            'medium_findings_review_status':'NOT_REQUIRED' if not unfixed_medium else ('APPROVED' if medium_review else 'PENDING'),
            'medium_findings_review_actor':medium_review.get('actor') if medium_review else None,
            'medium_findings_review_reference':medium_review.get('reference') if medium_review else None,
            'medium_findings_review_created_at':medium_review.get('created_at') if medium_review else None,
            'medium_findings_review_expires_at':medium_review.get('expires_at') if medium_review else None,
            'trivy_version':(trivy_version.stdout or trivy_version.stderr).strip().splitlines()[0] if (trivy_version.stdout or trivy_version.stderr).strip() else None,
            'trivy_binary_sha256':trivy_sha,
            'base_image':'python:3.12.16-slim-trixie@sha256:e695ab189fa2d082b1c61c69a6b888a5adeca61ceeccad107b1ed2a125721a9e',
            'uv_version':'0.13.7',
            'dependency_mode':'uv.lock frozen; runtime extras only; no editable install; no dev tooling',
            'runtime_user':'cknexus-non-root',
            'runtime_entrypoint':'python3 -m creator_app.unified',
            'runtime_extras':['email','gateway','billing','github-app'],
            'phase3_default':'false-fail-closed',
            'dependency_check':status(imports),
            'runtime_imports':status(imports),
            'dev_tooling_absent':status(imports),
            'health_smoke':status(smoke),
            'unified_control_smoke':status(smoke),
            'non_root_runtime':status(nonroot),
            'result':'PASS' if passed else ('REVIEW_REQUIRED' if image_scan_status in ('REVIEW_REQUIRED','OWNER_APPROVAL_REQUIRED') else ('BLOCKED' if image_scan_status=='BLOCKED' else 'FAIL')),
            'production_promotion_allowed':passed,
          }
          with open('Q16_PRODUCTION_IMAGE.json','w',encoding='utf-8') as f:
            json.dump(e,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps(e,indent=2,sort_keys=True))
          PY
      - name: Stop candidate
        if: always()
        run: docker rm -f cknexus-candidate 2>/dev/null || true
      - name: Upload production-image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q16-production-image-${{ steps.subject.outputs.target_sha }}
          path: |
            Q16_PRODUCTION_IMAGE.json
            docker-health.json
            docker-control-manifest.json
            docker-server.log
            trivy-image.json
            trivy-image-full.json
            q16-production-image.tar.gz
            q16-production-image.tar.gz.sha256
          if-no-files-found: error
      - name: Enforce production-image gate
        if: always()
        run: python3 -c "import json; x=json.load(open('Q16_PRODUCTION_IMAGE.json')); assert x['result']=='PASS' and x['production_promotion_allowed'] is True and x['image_scan_status']=='PASS' and x['image_config_digest'].startswith('sha256:')"
