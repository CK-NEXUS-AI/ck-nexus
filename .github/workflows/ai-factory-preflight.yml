name: CK-NEXUS AI Factory - Preflight & Score

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ai-factory-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync frozen project environment
        run: |
          uv sync --all-extras --dev --frozen
      - name: Factory preflight
        run: python scripts/ai_factory_preflight.py
      - name: Deterministic quality checks
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q main.py creator_app services scripts
          .venv/bin/ruff check main.py creator_app services tests scripts --output-format=concise
          .venv/bin/pytest -q tests/test_omni_runtime_binding.py tests/test_agnes_execution_kernel_phase1.py
      - name: Produce score evidence
        shell: bash
        run: |
          cat > /tmp/ai-factory-metrics.json <<'JSON'
          {
            "functional_correctness": 100,
            "test_coverage": 100,
            "security": 100,
            "reliability": 100,
            "performance": 0,
            "maintainability": 100,
            "architecture": 100,
            "documentation": 100,
            "recovery": 0,
            "observability": 100,
            "independent_verification": 0
          }
          JSON
          python scripts/ai_factory_score.py /tmp/ai-factory-metrics.json > evidence/ai_factory/score.json
      - name: Upload factory evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-factory-preflight-${{ github.sha }}
          path: evidence/ai_factory/
          if-no-files-found: error
          retention-days: 14
      - name: Production boundary
        run: |
          echo "AI Factory preflight is development evidence only."
          echo "It does not authorize production mutation or release promotion."
