name: CK-NEXUS Test Standards V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CKNEXUS_ENVIRONMENT: development
      CKNEXUS_HOST: 127.0.0.1
      PORT: '8000'
      CKNEXUS_ACCESS_TOKEN: test-access-value
      CKNEXUS_SECURITY_ACCESS_TOKEN: test-access-value
      CKNEXUS_MOCK_AI: 'true'
      CKNEXUS_GMAIL_OAUTH_ENABLED: 'false'
      CKNEXUS_GMAIL_SEND_ENABLED: 'false'
      CKNEXUS_CONNECTOR_FABRIC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen project sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Install test-only standards tools
        run: |
          uv pip install --python .venv/bin/python \
            'pytest-cov>=6,<8' 'pytest-timeout>=2,<3' 'freezegun>=1,<2'
      - name: Ruff standards files
        run: |
          .venv/bin/ruff check \
            creator_app/core/policy_errors.py \
            creator_app/core/checkpoint_guard.py \
            creator_app/core/computer_use_contract.py \
            creator_app/core/fanout_fanin_budget.py \
            creator_app/core/chat_bridge.py \
            creator_app/core/mcp_bridge_manifest.py \
            creator_app/core/resilience_faults.py \
            creator_app/core/resilience_evidence.py \
            creator_app/core/deterministic_state.py \
            creator_app/core/mock_provider.py \
            creator_app/core/ultra_capability_governance.py \
            creator_app/core/ultra_command_router.py \
            creator_app/core/model_capability_evidence.py \
            creator_app/core/capability_aware_model_router.py \
            tests/conftest.py \
            tests/test_chat_mcp_bridge.py \
            tests/test_gen6_runtime_contracts.py \
            tests/test_gen6_elastic_swarm.py \
            tests/test_gen6_cognitive_memory.py \
            tests/test_ultra_capability_governance.py \
            tests/test_capability_aware_model_router.py \
            tests/unit/test_resilience_evidence.py \
            tests/unit/test_deterministic_state.py \
            tests/unit/test_mock_provider.py \
            tests/integration/test_resilience_composition.py \
            tests/security/test_attack_contract_ids.py \
            tests/chaos/test_checkpoint_recovery.py \
            tests/chaos/test_disk_full.py \
            tests/chaos/test_fault_injection_contract.py \
            scripts/build_test_report.py
      - name: Run governed contract suite with coverage gate
        run: |
          .venv/bin/pytest \
            tests/test_chat_mcp_bridge.py \
            tests/test_gen6_elastic_swarm.py \
            tests/test_gen6_cognitive_memory.py \
            tests/test_ultra_capability_governance.py \
            tests/test_capability_aware_model_router.py \
            tests/unit/test_resilience_evidence.py \
            tests/unit/test_deterministic_state.py \
            tests/unit/test_mock_provider.py \
            tests/integration/test_resilience_composition.py \
            --mock-provider --timeout=30 \
            --cov=creator_app.core.chat_bridge \
            --cov=creator_app.core.mcp_bridge_manifest \
            --cov=creator_app.core.elastic_swarm_director \
            --cov=creator_app.core.memory_decay \
            --cov=creator_app.core.dream_consolidation \
            --cov=creator_app.core.experience_skill \
            --cov=creator_app.core.memory_regression \
            --cov=creator_app.core.resilience_faults \
            --cov=creator_app.core.resilience_evidence \
            --cov=creator_app.core.deterministic_state \
            --cov=creator_app.core.mock_provider \
            --cov=creator_app.core.ultra_capability_governance \
            --cov=creator_app.core.ultra_command_router \
            --cov=creator_app.core.model_capability_evidence \
            --cov=creator_app.core.capability_aware_model_router \
            --cov-report=xml:coverage.xml --cov-fail-under=80 \
            --junitxml=junit.xml -q
      - name: Build standardized evidence
        run: .venv/bin/python scripts/build_test_report.py
      - name: Attack IDs A-01 through A-05
        run: |
          .venv/bin/pytest tests/security/test_attack_contract_ids.py \
            --mock-provider --attack-mode --timeout=30 -v | tee attack_trace.log
      - name: Chaos level 3 bounded simulations
        run: |
          .venv/bin/pytest tests/chaos/ \
            --mock-provider --chaos-level=3 --timeout=30 -v | tee chaos_trace.log
      - name: Start isolated mock runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup .venv/bin/ck-nexus > /tmp/cknexus-test-standards.log 2>&1 &
          echo $! > /tmp/cknexus-test-standards.pid
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/docs; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/cknexus-test-standards.log
          exit 1
      - name: Existing black-box security attack regression
        run: .venv/bin/python scripts/security_attack_regression.py | tee -a attack_trace.log
      - name: Stop isolated runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cknexus-test-standards.pid ]; then
            kill "$(cat /tmp/cknexus-test-standards.pid)" 2>/dev/null || true
          fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ck-nexus-test-standards-v1
          path: |
            test_report.json
            attack_trace.log
            chaos_trace.log
            coverage.xml
            junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Production evidence boundary
        run: |
          echo 'Development test-standards evidence only.'
          echo 'Does not alter Q10/Q11/Q12, PR #14, or production authority.'
