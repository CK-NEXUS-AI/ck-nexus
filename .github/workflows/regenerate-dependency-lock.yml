name: Regenerate Dependency Lock

on:
  push:
    branches: [fix/security-deps-20261006-v2]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Regenerate lock
        run: uv lock
      - name: Commit regenerated lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "LOCK_UNCHANGED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(deps): regenerate uv lock"
          git push origin HEAD:fix/security-deps-20261006-v2
