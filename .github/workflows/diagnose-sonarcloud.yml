name: Diagnose SonarCloud PR analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Query SonarCloud status without printing credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SONAR_TOKEN"
          auth=(-u "$SONAR_TOKEN:")
          curl -fsS --retry 2 --max-time 20 "${auth[@]}" 'https://sonarcloud.io/api/ce/activity?component=spinlnw10-art_ck-nexus&pullRequest=389&ps=10' > ce.json
          curl -fsS --retry 2 --max-time 20 "${auth[@]}" 'https://sonarcloud.io/api/qualitygates/project_status?projectKey=spinlnw10-art_ck-nexus&pullRequest=389' > quality.json
          curl -fsS --retry 2 --max-time 20 "${auth[@]}" 'https://sonarcloud.io/api/issues/search?componentKeys=spinlnw10-art_ck-nexus&pullRequest=389&resolved=false&ps=100' > issues.json
          python - <<'PY'
          import json
          ce=json.load(open('ce.json'))
          q=json.load(open('quality.json'))
          issues=json.load(open('issues.json'))
          print('CE_ACTIVITY:')
          for t in ce.get('tasks',[]):
              print({k:t.get(k) for k in ('id','status','submittedAt','startedAt','executedAt','analysisId','errorMessage','errorType','warningCount')})
          print('QUALITY_GATE:',json.dumps(q.get('projectStatus',{}),sort_keys=True))
          print('OPEN_ISSUES_TOTAL:',issues.get('total'))
          for i in issues.get('issues',[]):
              print({k:i.get(k) for k in ('key','severity','type','message','component','line','rule','status')})
          PY
