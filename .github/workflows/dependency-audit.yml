name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and audit tool
        run: python -m pip install --upgrade pip && pip install -e '.[billing,email,github-app]' pip-audit
      - name: Audit installed dependencies
        run: pip-audit
