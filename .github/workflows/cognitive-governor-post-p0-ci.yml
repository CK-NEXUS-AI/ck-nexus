name: Cognitive Governor Post-P0 CI

on:
  pull_request:
    paths:
      - 'creator_app/cognitive_governor/**'
      - 'creator_app/evidence_vault/**'
      - 'creator_app/untrusted_content/**'
      - 'tests/test_cognitive_governor_v1.py'
      - '.github/workflows/cognitive-governor-post-p0-ci.yml'
  push:
    branches: [main]
    paths:
      - 'creator_app/cognitive_governor/**'
      - 'creator_app/evidence_vault/**'
      - 'creator_app/untrusted_content/**'
      - 'tests/test_cognitive_governor_v1.py'
      - '.github/workflows/cognitive-governor-post-p0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Governor and evidence tests
        run: .venv/bin/pytest -q tests/test_cognitive_governor_v1.py
      - name: Personal data plane regression
        run: .venv/bin/pytest -q tests/test_personal_data_plane_v1.py
      - name: Ruff
        run: |
          .venv/bin/ruff check \
            creator_app/cognitive_governor \
            creator_app/evidence_vault \
            creator_app/untrusted_content \
            tests/test_cognitive_governor_v1.py \
            --output-format=github
      - name: Bandit reviewed severity gate
        run: |
          set -euo pipefail
          .venv/bin/bandit -q -r \
            creator_app/cognitive_governor \
            creator_app/evidence_vault \
            creator_app/untrusted_content \
            -f json -o cognitive-governor-bandit.json || true
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('cognitive-governor-bandit.json').read_text())
          blocking = [
              item for item in data.get('results', [])
              if item.get('issue_severity') in {'MEDIUM', 'HIGH'}
          ]
          print(f'blocking_findings={len(blocking)}')
          if blocking:
              for item in blocking:
                  print(item.get('filename'), item.get('line_number'), item.get('test_id'))
              raise SystemExit(1)
          PY
      - name: Secret scan
        run: |
          set -euo pipefail
          ! git grep -nEI -- '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- \
            creator_app/cognitive_governor \
            creator_app/evidence_vault \
            creator_app/untrusted_content \
            tests/test_cognitive_governor_v1.py
      - name: Authority invariants
        run: |
          set -euo pipefail
          grep -R --line-number 'blocked_by_independent_safety_veto' creator_app/cognitive_governor
          grep -R --line-number 'production_mutation_requires_user_and_release_authority' creator_app/cognitive_governor
          grep -R --line-number 'trusted_for_instructions=False' creator_app/untrusted_content
          grep -R --line-number 'previous_digest' creator_app/evidence_vault
      - name: Production boundary
        run: |
          echo 'Cognitive Governor V1 is Post-P0 development infrastructure.'
          echo 'It cannot promote Q10/Q11/Q12 or authorize PR #14. Production NO-GO.'
