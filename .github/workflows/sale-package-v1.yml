name: CK-NEXUS Sale Package v1

on:
  pull_request:
    paths:
      - 'sale_package/v1/**'
      - 'seller_tools/**'
      - 'RELEASE_STATUS.md'
      - 'DELIVERY_MANIFEST.txt'
      - '.github/workflows/sale-package-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sale-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen

      - name: Build integrity-bound sale package
        run: |
          .venv/bin/python seller_tools/build_sale_package_v1.py "$RUNNER_TEMP/sale-build"
          cd "$RUNNER_TEMP/sale-build"
          sha256sum -c CK-NEXUS-Creator-Source-Sale-Package-v1.zip.sha256

      - name: Inspect sale archive
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path('${{ runner.temp }}') / 'sale-build'
          z = root / 'CK-NEXUS-Creator-Source-Sale-Package-v1.zip'
          required = {
              'CK-NEXUS-Creator-Source-Sale-Package-v1/SOURCE/CK-NEXUS-Creator-Edition-v0.2.0.zip',
              'CK-NEXUS-Creator-Source-Sale-Package-v1/BUYER/00_READ_ME_FIRST.md',
              'CK-NEXUS-Creator-Source-Sale-Package-v1/BUYER/KNOWN_LIMITATIONS.md',
              'CK-NEXUS-Creator-Source-Sale-Package-v1/BUYER/ACCEPTANCE_CHECKLIST.md',
              'CK-NEXUS-Creator-Source-Sale-Package-v1/TRANSACTION/COMMERCIAL_SCHEDULE_TEMPLATE.md',
              'CK-NEXUS-Creator-Source-Sale-Package-v1/PROVENANCE/RELEASE_IDENTITY.json',
              'CK-NEXUS-Creator-Source-Sale-Package-v1/PROVENANCE/PACKAGE_BUILD_INFO.json',
              'CK-NEXUS-Creator-Source-Sale-Package-v1/SHA256SUMS.txt',
          }
          with zipfile.ZipFile(z) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'missing sale-package entries: {missing}')
          print('sale archive structure: PASS')
          PY

      - name: Upload sale artifact
        uses: actions/upload-artifact@v4
        with:
          name: ck-nexus-sale-package-v1
          path: |
            ${{ runner.temp }}/sale-build/CK-NEXUS-Creator-Source-Sale-Package-v1.zip
            ${{ runner.temp }}/sale-build/CK-NEXUS-Creator-Source-Sale-Package-v1.zip.sha256
          if-no-files-found: error
          retention-days: 30
