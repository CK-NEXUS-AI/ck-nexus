name: Self Capability Reconciliation CI

on:
  push:
    branches: [post-p0/self-capability-reconcile-v1]
  pull_request:
    paths:
      - 'creator_app/core/**'
      - 'creator_app/ai_team/**'
      - 'creator_app/agnes/mcp_server.py'
      - 'start_all.sh'
      - 'run_anyclaw.py'
      - 'tests/test_team.py'
      - 'tests/test_universal.py'
      - 'scripts/verify_self_capability_handoff.py'
      - '.github/workflows/self-capability-reconciliation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen

      - name: Canonical quality gates
        run: |
          .venv/bin/python -m compileall -q creator_app scripts main.py
          .venv/bin/ruff check creator_app scripts tests main.py --output-format=github
          .venv/bin/bandit -r creator_app -q
          .venv/bin/python scripts/secret_scan.py

      - name: Fail-closed handoff verification
        run: .venv/bin/python scripts/verify_self_capability_handoff.py --json

      - name: Dedicated SelfCapability and AI-Team tests
        shell: bash
        run: |
          mapfile -t TESTS < <(
            {
              [ -f tests/test_team.py ] && echo tests/test_team.py
              [ -f tests/test_universal.py ] && echo tests/test_universal.py
              [ -d creator_app/ai_team/tests ] && find creator_app/ai_team/tests -maxdepth 1 -type f -name 'test_*.py' -print
            } | sort -u
          )
          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo 'No dedicated SelfCapability/AI-Team tests found.' >&2
            exit 1
          fi
          .venv/bin/pytest -q "${TESTS[@]}"

      - name: Boundary assertion
        run: |
          echo 'Post-P0 only: this workflow is not Q10/Q11/Q12 or production evidence.'
          echo 'Production status remains NO-GO until canonical closure completes.'
