name: Release evidence provenance

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release line
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Load immutable candidate identity
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          x=json.loads(Path('evidence/RELEASE_SUBJECT.json').read_text(encoding='utf-8'))
          print('subject='+x['runtime_subject_manifest_sha256'])
          PY

      - name: Verify GitHub Actions artifact provenance and exact candidate identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SUBJECT: ${{ steps.subject.outputs.subject }}
        run: |
          python3 .github/release-tools/verify_release_evidence_provenance.py \
            --expected-subject "$EXPECTED_SUBJECT" \
            --output release-evidence-provenance.json

      - name: Upload provenance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-provenance-${{ github.sha }}
          path: release-evidence-provenance.json
          if-no-files-found: error
          retention-days: 90
