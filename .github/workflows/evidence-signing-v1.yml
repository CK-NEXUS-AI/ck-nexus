name: Evidence Signing and Chain of Custody V1 CI

on:
  pull_request:
    paths:
      - 'creator_app/evidence_signing/**'
      - 'scripts/evidence_signing_v1.py'
      - 'tests/test_evidence_signing_v1.py'
      - 'docs/EVIDENCE_SIGNING_CHAIN_OF_CUSTODY_V1.md'
      - '.github/workflows/evidence-signing-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-signing-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install bounded test tools
        run: |
          python -m pip install 'pytest>=8,<10' 'ruff>=0.12,<1'

      - name: Compile and lint
        run: |
          python -m compileall -q creator_app/evidence_signing scripts/evidence_signing_v1.py
          ruff check             creator_app/evidence_signing             scripts/evidence_signing_v1.py             tests/test_evidence_signing_v1.py

      - name: Targeted evidence integrity tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_evidence_signing_v1.py

      - name: Signing boundary
        run: |
          echo 'PR CI performs no Sigstore signing and requests no OIDC id-token.'
          echo 'Live keyless signing requires a separate explicit public-transparency-log authorization.'
          echo 'Q10 remains NOT_VERIFIED; Production remains NO-GO.'
