name: Knowledge Lexical Retrieval V1 PostgreSQL Integration

on:
  pull_request:
    paths:
      - idea_engine/knowledge_repository.py
      - migrations/postgresql/004_knowledge_fabric_v2.sql
      - migrations/postgresql/005_knowledge_lexical_retrieval_v1.sql
      - tests/test_knowledge_lexical_retrieval_v1.py
      - tests/integration/test_knowledge_lexical_retrieval_postgres.py
      - .github/workflows/knowledge-lexical-postgres-integration.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CK_KNOWLEDGE_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/cknexus_knowledge_test

jobs:
  postgres-lexical-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cknexus_knowledge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cknexus_knowledge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record exact development subject
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain=v1)"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          uv lock --check
          uv sync --all-extras --dev --frozen

      - name: Apply persistence and lexical migrations
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d cknexus_knowledge_test -v ON_ERROR_STOP=1             -f migrations/postgresql/004_knowledge_fabric_v2.sql
          psql -h 127.0.0.1 -U postgres -d cknexus_knowledge_test -v ON_ERROR_STOP=1             -f migrations/postgresql/005_knowledge_lexical_retrieval_v1.sql

      - name: Run lexical unit and live PostgreSQL tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/pytest -q tests/test_knowledge_lexical_retrieval_v1.py
          .venv/bin/pytest -q tests/integration/test_knowledge_lexical_retrieval_postgres.py

      - name: Verify GIN index exists and is plannable
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          test "$(psql -At -h 127.0.0.1 -U postgres -d cknexus_knowledge_test             -c "SELECT to_regclass('public.knowledge_claims_lexical_fts_idx') IS NOT NULL")" = "t"
          plan="$(psql -At -h 127.0.0.1 -U postgres -d cknexus_knowledge_test <<'SQL'
          SET enable_seqscan = off;
          EXPLAIN (COSTS OFF)
          SELECT claim_id
          FROM knowledge_claims
          WHERE to_tsvector(
              'simple'::regconfig,
              subject || ' ' || predicate || ' ' ||
              COALESCE(payload ->> 'value', '')
          ) @@ websearch_to_tsquery('simple'::regconfig, 'lexical retrieval');
          SQL
          )"
          echo "$plan"
          grep -q "knowledge_claims_lexical_fts_idx" <<<"$plan"

      - name: Re-apply lexical migration for idempotency
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d cknexus_knowledge_test -v ON_ERROR_STOP=1             -f migrations/postgresql/005_knowledge_lexical_retrieval_v1.sql

      - name: Development evidence boundary
        shell: bash
        run: |
          echo "DEVELOPMENT VALIDATION ONLY"
          echo "No Q10/Q11/Q12 promotion or Production authorization."
