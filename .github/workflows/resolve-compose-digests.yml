name: Resolve production Compose digests

on:
  push:
    branches: [release/q10-q16-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Resolve immutable image digests
        shell: bash
        run: |
          set -euo pipefail
          : > compose-digests.txt
          for image in postgres:16-alpine redis:7-alpine caddy:2.10-alpine; do
            docker pull "$image" >/dev/null
            digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
            test -n "$digest"
            printf '%s=%s\n' "$image" "$digest" | tee -a compose-digests.txt
          done
          python - <<'PY'
          import json
          rows={}
          for line in open('compose-digests.txt',encoding='utf-8'):
              tag,digest=line.rstrip().split('=',1)
              rows[tag]=digest
          assert set(rows)=={'postgres:16-alpine','redis:7-alpine','caddy:2.10-alpine'}
          assert all('@sha256:' in value for value in rows.values())
          with open('COMPOSE_IMAGE_DIGESTS.json','w',encoding='utf-8') as f:
              json.dump(rows,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compose-image-digests-${{ github.sha }}
          path: COMPOSE_IMAGE_DIGESTS.json
          if-no-files-found: error
