name: Independent Patch Verifier Post-P0 CI

on:
  pull_request:
    paths:
      - 'creator_app/patch_verifier/**'
      - '.github/workflows/patch-verifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Verifier tests
        run: .venv/bin/pytest -q creator_app/patch_verifier/tests
      - name: Ruff
        run: .venv/bin/ruff check creator_app/patch_verifier --output-format=github
      - name: Bandit reviewed severity gate
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/bandit -r creator_app/patch_verifier -f json -o /tmp/verifier-bandit.json || true
          .venv/bin/python - <<'PY'
          import json, sys
          report=json.load(open('/tmp/verifier-bandit.json',encoding='utf-8'))
          blocking=[x for x in report.get('results',[]) if x.get('issue_severity') in {'MEDIUM','HIGH'}]
          print(f"bandit_blocking_findings={len(blocking)}")
          if blocking:
              print(json.dumps(blocking,indent=2,sort_keys=True))
          sys.exit(bool(blocking))
          PY
      - name: Secret scan
        run: .venv/bin/python scripts/secret_scan.py
      - name: Static verifier boundary
        shell: bash
        run: |
          set -euo pipefail
          kernel=creator_app/patch_verifier/verifier.py
          ! grep --line-number -E 'shell=True|os\.system\(|pytest|python -m|subprocess\.Popen' "$kernel"
          grep -q -- 'apply' "$kernel"
          grep -q -- '--check' "$kernel"
          grep -q -- 'patched_code_executed' "$kernel"
          grep -q -- 'patch_applied_to_canonical_checkout' "$kernel"
      - name: Production boundary
        run: |
          echo 'Independent Patch Verifier V1 verifies static applicability only.'
          echo 'It does not execute patched code and does not create release evidence.'
          echo 'Production remains NO-GO; Q10/Q11/Q12 and PR #14 are unchanged.'
