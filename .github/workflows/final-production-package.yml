name: Final production package

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

jobs:
  preflight:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      reason: ${{ steps.gate.outputs.reason }}
      expected_subject: ${{ steps.subject.outputs.subject }}
      candidate_sha: ${{ steps.subject.outputs.candidate_sha }}
      candidate_tree: ${{ steps.subject.outputs.candidate_tree }}
      release_pr_number: ${{ steps.subject.outputs.release_pr_number }}
      main_sha: ${{ steps.subject.outputs.main_sha }}
      main_tree: ${{ steps.subject.outputs.main_tree }}
      q16_run_id: ${{ steps.gate.outputs.q16_run_id }}
      q16_artifact_id: ${{ steps.gate.outputs.q16_artifact_id }}
      q16_image_digest: ${{ steps.gate.outputs.q16_image_digest }}
      q16_image_archive_sha: ${{ steps.gate.outputs.q16_image_archive_sha }}
      q16_licenses_run_id: ${{ steps.gate.outputs.q16_licenses_run_id }}
      q16_licenses_artifact_id: ${{ steps.gate.outputs.q16_licenses_artifact_id }}
    steps:
      - name: Checkout exact release line
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Load and verify immutable release subject and merged PR
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/release-subject-values.json"
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('evidence/RELEASE_SUBJECT.json').read_text(encoding='utf-8'))
          q10=json.loads(Path('evidence/Q10_DEPENDENCY_AUDIT.json').read_text(encoding='utf-8'))
          sha=q10['source_sha']
          tree=q10['source_tree']
          subject=manifest['runtime_subject_manifest_sha256']
          actual_tree=subprocess.check_output(['git','rev-parse',f'{sha}^{{tree}}'],text=True).strip()
          def subject_for(ref):
              listing=subprocess.check_output(['git','ls-tree','-r',ref,'--','app','creator_app','services','gateway','orchestration','idea_engine','migrations','deploy','observability','Dockerfile','docker-compose.prod.yml','main.py','pyproject.toml','uv.lock'],text=True)
              import hashlib
              return hashlib.sha256(listing.encode()).hexdigest()
          candidate_subject=subject_for(sha)
          subprocess.run(['git','fetch','origin','main'],check=True)
          head_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          main_sha=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          assert head_sha==main_sha, 'main branch drifted after workflow dispatch; rerun on current main'
          main_subject=subject_for('origin/main')
          assert actual_tree==tree, 'candidate tree mismatch'
          assert candidate_subject==subject and main_subject==subject, 'runtime subject mismatch'
          pr_number=int(manifest['release_pr_number'])
          pr=json.loads(subprocess.check_output(['gh','api',f"repos/{__import__('os').environ['GITHUB_REPOSITORY']}/pulls/{pr_number}"],text=True))
          assert manifest['candidate_branch']==pr.get('head',{}).get('ref'), 'candidate branch does not match merged release PR head'
          assert pr.get('state')=='closed' and pr.get('merged') is True and pr.get('base',{}).get('ref')=='main', 'closure PR not merged into main'
          merge_sha=pr.get('merge_commit_sha')
          subprocess.run(['git','fetch','origin',f'refs/pull/{pr_number}/head:refs/remotes/origin/closure-pr-{pr_number}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',sha,f'refs/remotes/origin/closure-pr-{pr_number}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',merge_sha,'origin/main'],check=True)
          assert subject_for('origin/main')==subject, 'merged main runtime subject mismatch'
          values={'candidate_sha':sha,'candidate_tree':tree,'subject':subject,'release_pr_number':pr_number,'main_sha':subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip(),'main_tree':subprocess.check_output(['git','rev-parse','origin/main^{tree}'],text=True).strip(),'merge_sha':merge_sha}
          print(json.dumps(values))
          PY
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          x=json.loads(Path(__import__('os').environ['RUNNER_TEMP']+'/release-subject-values.json').read_text())
          for k,v in x.items(): print(f'{k}={v}')
          PY

      - name: Verify release evidence provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SUBJECT: ${{ steps.subject.outputs.subject }}
        run: |
          python3 .github/release-tools/verify_release_evidence_provenance.py \
            --expected-subject "$EXPECTED_SUBJECT" \
            --output release-evidence-provenance.json

      - name: Evaluate all seven gates and approvals
        id: gate
        shell: bash
        env:
          EXPECTED_SUBJECT: ${{ steps.subject.outputs.subject }}
          CANDIDATE_SHA: ${{ steps.subject.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.subject.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          import re
          expected=__import__('os').environ['EXPECTED_SUBJECT']
          candidate_sha=__import__('os').environ['CANDIDATE_SHA']
          candidate_tree=__import__('os').environ['CANDIDATE_TREE']
          reasons=[]
          def load(name):
              try: return json.loads(Path('evidence',name).read_text(encoding='utf-8'))
              except Exception as exc:
                  reasons.append(f'{name}: {type(exc).__name__}')
                  return {}
          q10=load('Q10_DEPENDENCY_AUDIT.json')
          q11=load('Q11_OPENAI_LIVE.json')
          q12=load('Q12_CGROUP_V2.json')
          q13=load('Q13_POSTGRES_DR.json')
          q14=load('Q14_OBSERVABILITY_ALERT.json')
          q15=load('Q15_CLEAN_MACHINE.json')
          image=load('Q16_PRODUCTION_IMAGE.json')
          licenses=load('Q16_RUNTIME_LICENSE_SUMMARY.json')
          rows=(q10,q11,q12,q13,q14,q15,image,licenses)
          for row in rows:
              if not row: continue
              if row.get('source_sha') != candidate_sha or row.get('source_tree') != candidate_tree:
                  reasons.append(f"{row.get('gate','unknown')}: candidate source SHA/tree mismatch")
              if row.get('release_subject_manifest_sha256') != expected:
                  reasons.append(f"{row.get('gate','unknown')}: stale runtime subject")

          q10_ok=(
              q10.get('gate_result')=='NOT_VERIFIED'
              and q10.get('open_source_security_scan')=='PASS'
              and q10.get('security_assessment_status')=='READY_FOR_HUMAN_REVIEW'
              and q10.get('production_promotion_allowed') is False
              and q10.get('security_scan_run_id')==q10.get('github_run_id')
              and bool(q10.get('security_report_sha256'))
              and q10.get('issue_state_verified') is True
              and q10.get('scanner_toolchain_verified') is True
              and not q10.get('known_open_findings')
          )
          if not q10_ok: reasons.append('Q10: layered scanner evidence is incomplete or improperly promoted')
          if not (q11.get('result')=='PASS' and q11.get('production_promotion_allowed') is True and q11.get('credential_configured') is True and q11.get('credential_exposed') is False and q11.get('sentinel_observed') is True):
              reasons.append('Q11: exact-subject live provider evidence not PASS')
          if not (q12.get('result')=='PASS' and q12.get('actual_kernel_enforcement') is True and q12.get('delegation_ready') is True and q12.get('production_promotion_allowed') is True and q12.get('runner_user') not in {'root','0'} and {'cpu','memory','pids'}.issubset(set(q12.get('controllers',[]))) and {'cpu','memory','pids'}.issubset(set(q12.get('subtree_controllers',[]))) and str(q12.get('runner_cgroup','')).endswith('/supervisor')):
              reasons.append('Q12: non-root delegated cgroup v2 evidence not PASS')
          if not (q13.get('status')=='PASS' and q13.get('result')=='PASS' and q13.get('sentinel_round_trip')=='PASS' and q13.get('production_data_used') is False):
              reasons.append('Q13: isolated PostgreSQL backup/restore evidence not PASS')
          if not (q14.get('result')=='PASS' and q14.get('production_promotion_allowed') is True and q14.get('alert_delivery')=='PASS' and q14.get('health_metrics_check')=='PASS' and q14.get('alert_receiver_type')=='staging-webhook' and q14.get('production_destination_tested') is False and bool(re.fullmatch(r'sha256:[0-9a-f]{64}',str(q14.get('prometheus_image_digest','')))) and bool(re.fullmatch(r'sha256:[0-9a-f]{64}',str(q14.get('alertmanager_image_digest','')))) and bool(re.fullmatch(r'[0-9a-f]{64}',str(q14.get('alert_receipt_sha256',''))))):
              reasons.append('Q14: operator alert delivery evidence not PASS')
          if not (q15.get('result')=='PASS' and q15.get('production_promotion_allowed') is True and q15.get('host_class')=='fresh-github-hosted-vm' and q15.get('portable_regression')=='PASS' and q15.get('phase2_sandbox_regression')=='PASS' and q15.get('phase3_pipeline_regression')=='PASS' and q15.get('unified_health_smoke')=='PASS' and q15.get('unified_control_smoke')=='PASS'):
              reasons.append('Q15: clean-machine evidence not PASS')
          image_ok=(image.get('result')=='PASS' and image.get('production_promotion_allowed') is True and image.get('image_scan_status')=='PASS' and bool(re.fullmatch(r'sha256:[0-9a-f]{64}',str(image.get('image_config_digest','')))) and bool(re.fullmatch(r'[0-9a-f]{64}',str(image.get('image_archive_sha256','')))) and bool(image.get('image_scan_report_sha256')) and bool(image.get('image_scan_full_report_sha256')))
          if not image_ok: reasons.append('Q16: immutable production image or image scan not PASS')
          license_ok=(licenses.get('result')=='PASS' and licenses.get('production_promotion_allowed') is True and not licenses.get('unresolved_license_evidence') and int(licenses.get('runtime_distribution_count',0))>0 and bool(re.fullmatch(r'[0-9a-f]{64}',str(licenses.get('inventory_sha256','')))))
          if not license_ok: reasons.append('Q16: runtime license evidence incomplete')
          try:
              notices=Path('THIRD_PARTY_NOTICES.md').read_text(encoding='utf-8')
              if '[ต้องการข้อมูลเพิ่ม' in notices: reasons.append('third-party notices contain unresolved placeholder')
          except OSError: reasons.append('THIRD_PARTY_NOTICES.md missing')
          try:
              provenance=json.loads(Path('release-evidence-provenance.json').read_text(encoding='utf-8'))
              if provenance.get('result')!='PASS': reasons.append('release evidence provenance not PASS')
              if provenance.get('checks',{}).get('q10_human_approval',{}).get('approved') is not True:
                  reasons.append('Q10 independent review / Owner approval attestation not verified')
          except Exception: reasons.append('release evidence provenance report missing/invalid')
          eligible=not reasons
          print('eligible='+('true' if eligible else 'false'))
          print('reason='+('; '.join(reasons) if reasons else 'all seven gates and approvals pass'))
          if image.get('github_run_id'): print('q16_run_id='+str(image['github_run_id']))
          if image.get('artifact_id'): print('q16_artifact_id='+str(image['artifact_id']))
          if image.get('image_config_digest'): print('q16_image_digest='+str(image['image_config_digest']))
          if image.get('image_archive_sha256'): print('q16_image_archive_sha='+str(image['image_archive_sha256']))
          if licenses.get('github_run_id'): print('q16_licenses_run_id='+str(licenses['github_run_id']))
          if licenses.get('artifact_id'): print('q16_licenses_artifact_id='+str(licenses['artifact_id']))
          PY

      - name: Write eligibility summary
        shell: bash
        env:
          EXPECTED_SUBJECT: ${{ steps.subject.outputs.subject }}
        run: |
          {
            echo '## Final production eligibility'
            echo '- Evidence provenance: `PASS`'
            echo '- Eligible: `${{ steps.gate.outputs.eligible }}`'
            echo '- Reason: `${{ steps.gate.outputs.reason }}`'
            echo '- Runtime subject: `'$EXPECTED_SUBJECT'`'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release line
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify main baseline before packaging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify release evidence provenance again
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SUBJECT: ${{ needs.preflight.outputs.expected_subject }}
        run: |
          python3 .github/release-tools/verify_release_evidence_provenance.py \
            --expected-subject "$EXPECTED_SUBJECT" \
            --output release-evidence-provenance-package.json

      - name: Download the exact Q16 scanned image artifact
        env:
          GH_TOKEN: ${{ github.token }}
          Q16_RUN_ID: ${{ needs.preflight.outputs.q16_run_id }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          EXPECTED_ARCHIVE_SHA: ${{ needs.preflight.outputs.q16_image_archive_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.preflight.outputs.q16_image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q16-image"
          gh run download "$Q16_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "q16-production-image-$CANDIDATE_SHA" --dir "$RUNNER_TEMP/q16-image"
          echo "$EXPECTED_ARCHIVE_SHA  $RUNNER_TEMP/q16-image/q16-production-image.tar.gz" | sha256sum -c -
          docker load -i "$RUNNER_TEMP/q16-image/q16-production-image.tar.gz"
          actual=$(docker image inspect --format '{{.Id}}' "cknexus-candidate:${CANDIDATE_SHA}")
          test "$actual" = "$EXPECTED_IMAGE_DIGEST"

      - name: Download exact Q16 runtime-license inventory artifact
        env:
          GH_TOKEN: ${{ github.token }}
          Q16_LICENSES_RUN_ID: ${{ needs.preflight.outputs.q16_licenses_run_id }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q16-licenses"
          gh run download "$Q16_LICENSES_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "q16-runtime-licenses-$CANDIDATE_SHA" --dir "$RUNNER_TEMP/q16-licenses"
          expected=$(python3 -c "import json; print(json.load(open('evidence/Q16_RUNTIME_LICENSE_SUMMARY.json'))['inventory_sha256'])")
          echo "$expected  $RUNNER_TEMP/q16-licenses/Q16_RUNTIME_LICENSE_INVENTORY.json" | sha256sum -c -

      - name: Download exact Q10-Q15 evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          gates={
              'Q10':'evidence/Q10_DEPENDENCY_AUDIT.json',
              'Q11':'evidence/Q11_OPENAI_LIVE.json',
              'Q12':'evidence/Q12_CGROUP_V2.json',
              'Q13':'evidence/Q13_POSTGRES_DR.json',
              'Q14':'evidence/Q14_OBSERVABILITY_ALERT.json',
              'Q15':'evidence/Q15_CLEAN_MACHINE.json',
          }
          for gate,path in gates.items():
              evidence=json.loads(Path(path).read_text(encoding='utf-8'))
              run_id=str(evidence['github_run_id'])
              artifact_name=evidence['artifact_name']
              artifact_id=int(evidence['artifact_id'])
              digest=evidence['artifact_digest']
              assert evidence.get('source_sha')==os.environ['EXPECTED_CANDIDATE_SHA'], f'{gate}: evidence source SHA is not the selected candidate'
              assert evidence.get('source_tree')==os.environ['EXPECTED_CANDIDATE_TREE'], f'{gate}: evidence source tree is not the selected candidate'
              assert evidence.get('release_subject_manifest_sha256')==os.environ['EXPECTED_SUBJECT'], f'{gate}: release subject mismatch'
              run_response=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],text=True)
              run=json.loads(run_response)
              assert run.get('id')==int(run_id) and run.get('head_sha')==os.environ['EXPECTED_CANDIDATE_SHA'], f'{gate}: workflow run SHA is not the selected candidate'
              assert run.get('event')=='workflow_dispatch' and run.get('conclusion')=='success', f'{gate}: workflow run is not a successful manual candidate run'
              assert run.get('head_branch')==evidence.get('github_run_head_branch'), f'{gate}: workflow run branch mismatch'
              assert run.get('path','').split('@')[0]==evidence.get('workflow_path'), f'{gate}: workflow path mismatch'
              assert run.get('name')==evidence.get('workflow_name'), f'{gate}: workflow name mismatch'
              assert run.get('html_url')==evidence.get('workflow_url'), f'{gate}: workflow URL mismatch'
              response=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts?per_page=100"],text=True)
              artifacts=json.loads(response).get('artifacts',[])
              match=[item for item in artifacts if int(item.get('id',-1))==artifact_id and item.get('name')==artifact_name and item.get('digest')==digest and item.get('expired') is False]
              assert len(match)==1, f'{gate}: exact artifact metadata mismatch'
              import hashlib, stat, urllib.parse, zipfile
              from pathlib import PurePosixPath
              destination=Path(os.environ['RUNNER_TEMP'])/'gate-artifacts'/gate
              destination.mkdir(parents=True,exist_ok=True)
              archive_url=match[0].get('archive_download_url','')
              parsed_url=urllib.parse.urlparse(archive_url)
              assert parsed_url.scheme=='https' and parsed_url.netloc=='api.github.com', f'{gate}: untrusted artifact download host'
              archive_path=destination.parent/f'{artifact_id}.zip'
              subprocess.run([
                  'curl','--fail','--silent','--show-error','--location',
                  '--header',f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                  '--header','Accept: application/vnd.github+json',
                  archive_url,'--output',str(archive_path)
              ],check=True)
              archive_sha=hashlib.sha256(archive_path.read_bytes()).hexdigest()
              assert digest==f'sha256:{archive_sha}', f'{gate}: downloaded artifact digest mismatch'
              with zipfile.ZipFile(archive_path) as bundle:
                  entries=bundle.infolist()
                  assert len(entries)<=50000, f'{gate}: artifact has too many files'
                  assert sum(item.file_size for item in entries)<=1024*1024*1024, f'{gate}: artifact exceeds extraction limit'
                  for item in entries:
                      relative=PurePosixPath(item.filename)
                      assert not relative.is_absolute() and '..' not in relative.parts, f'{gate}: unsafe artifact path'
                      mode=(item.external_attr >> 16) & 0xffff
                      assert not stat.S_ISLNK(mode), f'{gate}: artifact contains a symbolic link'
                      target=destination.joinpath(*relative.parts)
                      assert destination.resolve() in target.resolve().parents or target.resolve()==destination.resolve(), f'{gate}: artifact path escapes destination'
                      if item.is_dir():
                          target.mkdir(parents=True,exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True,exist_ok=True)
                          with bundle.open(item) as source, target.open('xb') as output:
                              shutil.copyfileobj(source,output)
              archive_path.unlink()
              downloaded=destination/Path(path).name
              assert downloaded.is_file(), f'{gate}: raw evidence file missing from artifact'
              raw=json.loads(downloaded.read_text(encoding='utf-8'))
              metadata={'artifact_id','artifact_digest','artifact_name','artifact_created_at','artifact_expires_at','github_run_head_sha','github_run_head_branch','github_run_conclusion','github_run_event','workflow_path','workflow_name','workflow_url'}
              committed=json.loads(Path(path).read_text(encoding='utf-8'))
              committed_raw={key:value for key,value in committed.items() if key not in metadata}
              assert raw==committed_raw, f'{gate}: committed evidence differs from immutable workflow artifact'
          PY

      - name: Verify exact evidence artifact contents and provenance manifest
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          EXPECTED_CANDIDATE_TREE: ${{ needs.preflight.outputs.candidate_tree }}
          EXPECTED_SUBJECT: ${{ needs.preflight.outputs.expected_subject }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence')
          temp_root=Path(__import__('os').environ['RUNNER_TEMP'])
          metadata={'artifact_id','artifact_digest','artifact_name','artifact_created_at','artifact_expires_at','github_run_head_sha','github_run_head_branch','github_run_conclusion','github_run_event','workflow_path','workflow_name','workflow_url'}
          files={
              'Q10':'Q10_DEPENDENCY_AUDIT.json','Q11':'Q11_OPENAI_LIVE.json','Q12':'Q12_CGROUP_V2.json',
              'Q13':'Q13_POSTGRES_DR.json','Q14':'Q14_OBSERVABILITY_ALERT.json','Q15':'Q15_CLEAN_MACHINE.json',
              'Q16_PRODUCTION_IMAGE':'Q16_PRODUCTION_IMAGE.json','Q16_RUNTIME_LICENSES':'Q16_RUNTIME_LICENSE_SUMMARY.json',
          }
          manifest=json.loads((root/'ARTIFACT_PROVENANCE_MANIFEST.json').read_text(encoding='utf-8'))
          assert set(manifest['artifacts'])==set(files), 'artifact manifest gate set mismatch'
          q10=json.loads((root/files['Q10']).read_text(encoding='utf-8'))
          assert manifest['candidate_source_sha']==q10['source_sha']
          assert manifest['candidate_source_tree']==q10['source_tree']
          for gate,filename in files.items():
              committed=json.loads((root/filename).read_text(encoding='utf-8'))
              entry=manifest['artifacts'][gate]
              assert entry['run_id']==committed['github_run_id']
              assert entry['head_sha']==committed['source_sha']
              assert entry['artifact_id']==committed['artifact_id']
              assert entry['artifact_name']==committed['artifact_name']
              assert entry['artifact_digest']==committed['artifact_digest']
              folder=temp_root/'q16-image' if gate=='Q16_PRODUCTION_IMAGE' else (temp_root/'q16-licenses' if gate=='Q16_RUNTIME_LICENSES' else temp_root/'gate-artifacts'/gate)
              raw_path=folder/filename
              assert raw_path.is_file(), f'{gate}: artifact evidence missing'
              raw=json.loads(raw_path.read_text(encoding='utf-8'))
              assert raw=={k:v for k,v in committed.items() if k not in metadata}, f'{gate}: artifact evidence content mismatch'
          q11_output=temp_root/'gate-artifacts/Q11/q11-output.txt'
          q11_evidence=json.loads((root/files['Q11']).read_text(encoding='utf-8'))
          assert q11_output.is_file() and hashlib.sha256(q11_output.read_bytes()).hexdigest()==q11_evidence['diagnostic_sha256']
          q11_text=q11_output.read_text(encoding='utf-8',errors='replace')
          assert q11_evidence['diagnostic_redaction_verified'] is True
          assert not __import__('re').search(r'(?i)sk-(?:proj-)?[A-Za-z0-9_-]{20,}',q11_text)
          report_path=temp_root/'gate-artifacts/Q10/q10-open-source-security-report.json'
          assert report_path.is_file()
          assert hashlib.sha256(report_path.read_bytes()).hexdigest()==q10['security_report_sha256']
          report=json.loads(report_path.read_text(encoding='utf-8'))
          for item in report['report_artifacts'].values():
              path=temp_root/'gate-artifacts/Q10'/item['file']
              assert path.is_file() and path.stat().st_size==item['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256'], item['file']
          image=json.loads((root/files['Q16_PRODUCTION_IMAGE']).read_text(encoding='utf-8'))
          archive=temp_root/'q16-image/q16-production-image.tar.gz'
          assert archive.is_file() and hashlib.sha256(archive.read_bytes()).hexdigest()==image['image_archive_sha256']
          licenses=json.loads((root/files['Q16_RUNTIME_LICENSES']).read_text(encoding='utf-8'))
          inventory=temp_root/'q16-licenses/Q16_RUNTIME_LICENSE_INVENTORY.json'
          assert inventory.is_file() and hashlib.sha256(inventory.read_bytes()).hexdigest()==licenses['inventory_sha256']
          print('All eight exact-subject evidence artifacts, raw report hashes, Q16 image and license inventory verified.')
          PY

      - name: Re-run source integrity, lint and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "uv==0.13.7"
          uv lock --check
          uv sync --all-extras --dev --frozen
          .venv/bin/python3 -m compileall -q main.py creator_app services gateway orchestration idea_engine scripts
          .venv/bin/ruff check main.py creator_app services gateway orchestration idea_engine tests scripts
          .venv/bin/python3 scripts/secret_scan.py
          .venv/bin/pytest -q --ignore=tests/test_agnes_execution_kernel_phase2.py --ignore=tests/test_agnes_execution_kernel_phase3.py

      - name: Verify loaded production image metadata without executing the artifact
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="cknexus-candidate:$CANDIDATE_SHA"
          image_user=$(docker image inspect --format '{{.Config.User}}' "$image")
          image_cmd=$(docker image inspect --format '{{json .Config.Cmd}}' "$image")
          test "$image_user" = "cknexus"
          test "$image_cmd" = '["python","-m","creator_app.unified"]'
          printf 'image_user=%s\nimage_cmd=%s\n' "$image_user" "$image_cmd" > final-image-config.txt
          echo 'Exact Q16 image metadata verified. Runtime execution remains in the isolated candidate-image workflow.'

      - name: Verify and package exact runtime license files from candidate workflow
        shell: bash
        run: |
          set -euo pipefail
          export_root="$RUNNER_TEMP/q16-licenses"
          test -f "$export_root/EXPORT_MANIFEST.json"
          rm -rf package-root
          mkdir -p package-root/ck-nexus/third_party_runtime
          git archive HEAD | tar -x -C package-root/ck-nexus
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'q16-licenses'
          manifest=json.loads((root/'EXPORT_MANIFEST.json').read_text(encoding='utf-8'))
          summary=json.loads((root/'Q16_RUNTIME_LICENSE_SUMMARY.json').read_text(encoding='utf-8'))
          assert manifest['distribution_count']==summary['runtime_distribution_count']
          files=manifest.get('files',[])
          assert files, 'runtime license export is empty'
          for item in files:
              path=(root/item['path']).resolve()
              assert root.resolve() in path.parents
              data=path.read_bytes()
              assert hashlib.sha256(data).hexdigest()==item['sha256'], item['path']
          inventory=json.loads((root/'Q16_RUNTIME_LICENSE_INVENTORY.json').read_text(encoding='utf-8'))
          expected={(row['name'].lower(),row['version']):{(f['path'],f['sha256']) for f in row['license_files']} for row in inventory}
          actual={(dist['name'].lower(),dist['version']):{(f['source_path'],f['sha256']) for f in dist['files']} for dist in manifest['distributions']}
          assert set(expected)==set(actual), 'runtime distribution identity mismatch'
          for identity,expected_files in expected.items():
              assert expected_files==actual[identity], f'license file export mismatch: {identity}'
          assert manifest['file_count']==sum(len(x) for x in expected.values())
          print('Runtime license file export verified:',len(files),'files')
          PY
          cp "$RUNNER_TEMP/q16-licenses/EXPORT_MANIFEST.json" package-root/ck-nexus/third_party_runtime/LICENSE_EXPORT_MANIFEST.json
          cp -a "$RUNNER_TEMP/q16-licenses/licenses" package-root/ck-nexus/third_party_runtime/licenses
          cp "$RUNNER_TEMP/q16-licenses/Q16_RUNTIME_LICENSE_INVENTORY.json" package-root/ck-nexus/third_party_runtime/Q16_RUNTIME_LICENSE_INVENTORY.json
          cp "$RUNNER_TEMP/q16-image/q16-production-image.tar.gz" package-root/ck-nexus/third_party_runtime/CK-NEXUS_PRODUCTION_IMAGE.tar.gz
          image_archive_sha=$(sha256sum package-root/ck-nexus/third_party_runtime/CK-NEXUS_PRODUCTION_IMAGE.tar.gz | awk '{print $1}')
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'q16-image'
          evidence=json.loads((root/'Q16_PRODUCTION_IMAGE.json').read_text(encoding='utf-8'))
          archive_sha=hashlib.sha256((root/'q16-production-image.tar.gz').read_bytes()).hexdigest()
          report_sha=hashlib.sha256((root/'trivy-image.json').read_bytes()).hexdigest()
          assert evidence['result']=='PASS' and evidence['production_promotion_allowed'] is True
          assert evidence['image_scan_status']=='PASS'
          assert archive_sha==evidence['image_archive_sha256']
          assert report_sha==evidence['image_scan_report_sha256']
          full_report_sha=hashlib.sha256((root/'trivy-image-full.json').read_bytes()).hexdigest()
          assert full_report_sha==evidence['image_scan_full_report_sha256']
          print('Exact Q16 image archive and Trivy report verified')
          PY
          test "$image_archive_sha" = "$(sha256sum "$RUNNER_TEMP/q16-image/q16-production-image.tar.gz" | awk '{print $1}')"
          license_inventory_sha=$(sha256sum package-root/ck-nexus/third_party_runtime/Q16_RUNTIME_LICENSE_INVENTORY.json | awk '{print $1}')
          echo "LICENSE_INVENTORY_SHA=$license_inventory_sha" >> "$GITHUB_ENV"
          mkdir -p package-root/ck-nexus/third_party_runtime/evidence-artifacts
          cp -a "$RUNNER_TEMP/gate-artifacts/." package-root/ck-nexus/third_party_runtime/evidence-artifacts/
          cp -a "$RUNNER_TEMP/q16-image" package-root/ck-nexus/third_party_runtime/evidence-artifacts/Q16_PRODUCTION_IMAGE
          rm -f package-root/ck-nexus/third_party_runtime/evidence-artifacts/Q16_PRODUCTION_IMAGE/q16-production-image.tar.gz
          cp -a "$RUNNER_TEMP/q16-licenses" package-root/ck-nexus/third_party_runtime/evidence-artifacts/Q16_RUNTIME_LICENSES
          cp release-evidence-provenance-package.json package-root/ck-nexus/third_party_runtime/evidence-artifacts/RELEASE_EVIDENCE_PROVENANCE.json

      - name: Build checksummed production source and image package
        env:
          EXPECTED_SUBJECT: ${{ needs.preflight.outputs.expected_subject }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.preflight.outputs.candidate_tree }}
          Q16_IMAGE_DIGEST: ${{ needs.preflight.outputs.q16_image_digest }}
          Q16_IMAGE_ARCHIVE_SHA: ${{ needs.preflight.outputs.q16_image_archive_sha }}
          RELEASE_PR_NUMBER: ${{ needs.preflight.outputs.release_pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          release_commit=$(git rev-parse HEAD)
          tar -czf "dist/CK-NEXUS_PRODUCTION_${release_commit}.tar.gz" -C package-root ck-nexus
          archive_sha=$(sha256sum "dist/CK-NEXUS_PRODUCTION_${release_commit}.tar.gz" | awk '{print $1}')
          printf '%s  %s\n' "$archive_sha" "CK-NEXUS_PRODUCTION_${release_commit}.tar.gz" > dist/SHA256SUMS
          python3 - "$release_commit" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$EXPECTED_SUBJECT" "$archive_sha" "$Q16_IMAGE_DIGEST" "$Q16_IMAGE_ARCHIVE_SHA" "$LICENSE_INVENTORY_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          release_commit,candidate_sha,candidate_tree,subject,archive_sha,image_digest,image_archive_sha,license_sha=sys.argv[1:]
          q10=json.loads(Path('evidence/Q10_DEPENDENCY_AUDIT.json').read_text(encoding='utf-8'))
          provenance=json.loads(Path('release-evidence-provenance-package.json').read_text(encoding='utf-8'))
          q10_approval=provenance['checks']['q10_human_approval']
          artifact_manifest=json.loads(Path('evidence/ARTIFACT_PROVENANCE_MANIFEST.json').read_text(encoding='utf-8'))
          artifact_manifest_sha=__import__('hashlib').sha256(Path('evidence/ARTIFACT_PROVENANCE_MANIFEST.json').read_bytes()).hexdigest()
          provenance_sha=__import__('hashlib').sha256(Path('release-evidence-provenance-package.json').read_bytes()).hexdigest()
          manifest={
              'schema_version':2,
              'release_commit':release_commit,
              'candidate_source_sha':candidate_sha,
              'candidate_source_tree':candidate_tree,
              'release_pr_number':int(__import__('os').environ['RELEASE_PR_NUMBER']),
              'main_source_sha':'${{ needs.preflight.outputs.main_sha }}',
              'main_source_tree':'${{ needs.preflight.outputs.main_tree }}',
              'runtime_subject_sha256':subject,
              'source_package_sha256':archive_sha,
              'production_image_config_digest':image_digest,
              'production_image_archive_sha256':image_archive_sha,
              'runtime_license_inventory_sha256':license_sha,
              'q16_runtime_license_source_inventory_sha256':json.loads(Path('evidence/Q16_RUNTIME_LICENSE_SUMMARY.json').read_text(encoding='utf-8'))['inventory_sha256'],
              'q10_security_report_sha256':q10['security_report_sha256'],
              'q10_effective_status':'PASS',
              'q10_review_attestation':q10_approval,
              'q15_phase2_sandbox_regression':json.loads(Path('evidence/Q15_CLEAN_MACHINE.json').read_text(encoding='utf-8'))['phase2_sandbox_regression'],
              'q15_phase3_pipeline_regression':json.loads(Path('evidence/Q15_CLEAN_MACHINE.json').read_text(encoding='utf-8'))['phase3_pipeline_regression'],
              'q14_alert_receiver_type':json.loads(Path('evidence/Q14_OBSERVABILITY_ALERT.json').read_text(encoding='utf-8'))['alert_receiver_type'],
              'q14_production_destination_tested':json.loads(Path('evidence/Q14_OBSERVABILITY_ALERT.json').read_text(encoding='utf-8'))['production_destination_tested'],
              'production_gate':'PASS',
              'third_party_runtime_inventory_included':True,
              'third_party_license_files_included':True,
              'release_evidence_provenance':'PASS',
              'release_evidence_provenance_sha256':provenance_sha,
              'evidence_artifacts_included':True,
              'artifact_provenance_manifest_sha256':artifact_manifest_sha,
              'artifact_provenance':artifact_manifest['artifacts'],
          }
          Path('dist/RELEASE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          (cd dist && sha256sum "CK-NEXUS_PRODUCTION_${release_commit}.tar.gz" RELEASE_MANIFEST.json > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Verify main has not drifted during packaging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Upload production release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ck-nexus-production-${{ github.sha }}
          path: |
            dist/CK-NEXUS_PRODUCTION_${{ github.sha }}.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
