name: Sandbox Executor Post-P0 CI

on:
  pull_request:
    paths:
      - 'creator_app/sandbox_executor/**'
      - 'creator_app/dev_assistants/execution.py'
      - '.github/workflows/sandbox-executor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Sandbox executor tests
        run: .venv/bin/pytest -q creator_app/sandbox_executor/tests
      - name: Development execution contract regression
        run: .venv/bin/pytest -q creator_app/dev_assistants/tests
      - name: Ruff
        run: >-
          .venv/bin/ruff check
          creator_app/sandbox_executor
          creator_app/dev_assistants/execution.py
          --output-format=github
      - name: Bandit reviewed severity gate
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/bandit -r creator_app/sandbox_executor -f json -o /tmp/sandbox-bandit.json || true
          .venv/bin/python - <<'PY'
          import json
          import sys

          with open('/tmp/sandbox-bandit.json', encoding='utf-8') as handle:
              report = json.load(handle)
          results = report.get('results', [])
          blocking = [
              {
                  'test_id': item.get('test_id'),
                  'severity': item.get('issue_severity'),
                  'confidence': item.get('issue_confidence'),
                  'filename': item.get('filename'),
                  'line': item.get('line_number'),
              }
              for item in results
              if item.get('issue_severity') in {'MEDIUM', 'HIGH'}
          ]
          low_count = sum(item.get('issue_severity') == 'LOW' for item in results)
          print(f"bandit_low_findings={low_count}")
          print(f"bandit_blocking_findings={len(blocking)}")
          if blocking:
              print(json.dumps(blocking, indent=2, sort_keys=True))
          sys.exit(bool(blocking))
          PY
      - name: Secret scan
        run: .venv/bin/python scripts/secret_scan.py
      - name: Static containment assertions
        shell: bash
        run: |
          set -euo pipefail
          kernel=creator_app/sandbox_executor/executor.py
          ! grep --line-number -E 'shell=True|os\.system\(|--privileged|docker\.sock' "$kernel"
          grep -q -- '"--pull=never"' "$kernel"
          grep -q -- '"--network=none"' "$kernel"
          grep -q -- '"--read-only"' "$kernel"
          grep -q -- '"--cap-drop=ALL"' "$kernel"
          grep -q -- '"--security-opt=no-new-privileges"' "$kernel"
          grep -q -- 'refuses to run as root' "$kernel"
          grep -q -- 'does not resolve or forward credentials' "$kernel"
      - name: Production boundary
        run: |
          echo 'Sandbox Executor V1 is Post-P0 development infrastructure only.'
          echo 'Execution success remains EXECUTED_UNVERIFIED until independent verification.'
          echo 'No patch is auto-applied or committed by the executor.'
          echo 'No Q10/Q11/Q12 promotion and no PR #14 merge authority.'
