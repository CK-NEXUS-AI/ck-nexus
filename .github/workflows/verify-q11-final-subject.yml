name: Verify Q11 final release subject

on:
  push:
    branches: [verify/q11-final-subject]
  workflow_dispatch:

permissions:
  contents: read

env:
  Q11_SOURCE_SHA: ad2fac7aa0752117dde065c7ad9b0b8d41136aa2
  Q11_SOURCE_TREE: eb2074176319072ca3f31d5c8c990752ba849b0a
  Q11_RELEASE_SUBJECT: 772662ac4ed60e785f30370c0c66bfdf8f798ea5f67fe13063404b20f2f74200

jobs:
  q11:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.Q11_SOURCE_SHA }}
          fetch-depth: 1
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify release subject and frozen environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$Q11_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$Q11_SOURCE_TREE"
          subject=$(git ls-tree -r HEAD -- app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          test "$subject" = "$Q11_RELEASE_SUBJECT"
          python -m pip install "uv==0.12.4"
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Run P0-AI-001 without exposing secret
        id: smoke
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: ${{ vars.OPENAI_SMOKE_MODEL }}
        run: |
          set +e
          .venv/bin/python scripts/test_openai_live.py >q11-output.txt 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Emit exact Q11 evidence
        env:
          RUN_ID: ${{ github.run_id }}
          RC: ${{ steps.smoke.outputs.rc }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          .venv/bin/python - "$Q11_SOURCE_SHA" "$Q11_SOURCE_TREE" "$Q11_RELEASE_SUBJECT" "$RUN_ID" "$RC" <<'PY'
          import json,os,sys
          sha,tree,subject,run_id,rc=sys.argv[1:]
          rc=int(rc)
          text=open('q11-output.txt',encoding='utf-8').read().strip()
          status='PASS' if rc==0 else ('BLOCKED' if rc==2 else 'FAIL')
          evidence={
              'schema_version':4,'gate':'Q11','source_sha':sha,'source_tree':tree,
              'release_subject_manifest_sha256':subject,'github_run_id':int(run_id),
              'credential_configured':bool(os.getenv('OPENAI_API_KEY','').strip()),
              'credential_exposed':False,'p0_ai_001_exit_code':rc,
              'sentinel_observed':'CK-NEXUS-P0-SMOKE-PASS' in text,
              'result':status,'production_promotion_allowed':rc==0,
              'diagnostic':text[:1000],
          }
          with open('Q11_OPENAI_LIVE.json','w',encoding='utf-8') as f:
              json.dump(evidence,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps({k:v for k,v in evidence.items() if k!='diagnostic'},indent=2,sort_keys=True))
          PY
      - name: Upload Q11 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q11-final-${{ env.Q11_SOURCE_SHA }}
          path: |
            Q11_OPENAI_LIVE.json
            q11-output.txt
          if-no-files-found: error
      - name: Enforce Q11
        run: test '${{ steps.smoke.outputs.rc }}' -eq 0
