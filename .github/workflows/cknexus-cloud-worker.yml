name: CK-NEXUS Cloud Worker
run-name: CK-NEXUS Cloud Worker ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by CK-NEXUS
        required: true
        type: string
      task_kind:
        description: Fixed validation profile; no arbitrary shell commands
        required: true
        type: choice
        options:
          - tests
          - security
          - full_validation
      subject_sha:
        description: Immutable 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cknexus-cloud-worker-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Isolated cloud validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CKNEXUS_CLOUD_REQUEST_ID: ${{ inputs.request_id }}
      CKNEXUS_CLOUD_TASK_KIND: ${{ inputs.task_kind }}
      CKNEXUS_CLOUD_SUBJECT_SHA: ${{ inputs.subject_sha }}
    steps:
      - name: Validate dispatch contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CKNEXUS_CLOUD_REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$CKNEXUS_CLOUD_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$CKNEXUS_CLOUD_TASK_KIND" in
            tests|security|full_validation) ;;
            *) echo "unsupported task profile"; exit 2 ;;
          esac

      - name: Checkout immutable subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.subject_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out subject identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CKNEXUS_CLOUD_SUBJECT_SHA"
          echo "CKNEXUS_CLOUD_SUBJECT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install locked development environment
        if: inputs.task_kind == 'tests' || inputs.task_kind == 'full_validation' || inputs.task_kind == 'security'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv lock --check
          uv sync --all-extras --dev --frozen

      - name: Run repository tests
        id: tests
        if: inputs.task_kind == 'tests' || inputs.task_kind == 'full_validation'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/pytest -q --tb=short 2>&1 | tee cloud-worker-pytest.log

      - name: Run security validation
        id: security
        if: inputs.task_kind == 'security' || inputs.task_kind == 'full_validation'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/ruff check main.py creator_app services tests scripts
          .venv/bin/bandit -r creator_app services main.py -f json -o cloud-worker-bandit.json || true
          .venv/bin/python - <<'PY'
          import hashlib, json, sys
          report = json.load(open("cloud-worker-bandit.json", encoding="utf-8"))
          reviewed = {
              ("B608", "services/email_gateway/repository.py", 221, "a248369faca360edbca232b1700ef67d87d9eeae8401bb1b379122f3274a4a6a"),
              ("B608", "services/email_gateway/repository.py", 230, "2948e929a8c5a30e600e2d06c3cea59da396aa196adfd234183556d877df3de0"),
          }
          blocking = []
          for item in report.get("results", []):
              if item.get("issue_severity") not in {"MEDIUM", "HIGH"}:
                  continue
              fingerprint = (
                  item.get("test_id"),
                  item.get("filename"),
                  item.get("line_number"),
                  hashlib.sha256(item.get("code", "").encode()).hexdigest(),
              )
              if fingerprint not in reviewed:
                  blocking.append(fingerprint)
          print("unreviewed_bandit_medium_high=", blocking)
          sys.exit(bool(blocking))
          PY
          .venv/bin/pip-audit --local --skip-editable --progress-spinner off
          .venv/bin/python scripts/secret_scan.py

      - name: Emit execution evidence
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          evidence = {
              "schema_version": 1,
              "evidence_type": "CKNEXUS_CLOUD_WORKER_VALIDATION",
              "request_id": os.environ["CKNEXUS_CLOUD_REQUEST_ID"],
              "task_kind": os.environ["CKNEXUS_CLOUD_TASK_KIND"],
              "source_sha": git("rev-parse", "HEAD"),
              "source_tree": git("rev-parse", "HEAD^{tree}"),
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_os": os.environ.get("RUNNER_OS"),
              "tests_outcome": os.environ.get("TEST_OUTCOME", "skipped"),
              "security_outcome": os.environ.get("SECURITY_OUTCOME", "skipped"),
              "workflow_job_status": "pending_final_gate",
              "final_gate_pending": True,
              "external_mutation_authorized": False,
              "release_evidence": False,
              "q10_status": "NOT_VERIFIED",
              "production_status": "NO-GO",
          }
          with open("CKNEXUS_CLOUD_WORKER_EVIDENCE.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cknexus-cloud-worker-${{ inputs.request_id }}
          path: |
            CKNEXUS_CLOUD_WORKER_EVIDENCE.json
            cloud-worker-pytest.log
            cloud-worker-bandit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce selected task outcome
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CKNEXUS_CLOUD_TASK_KIND" == "tests" || "$CKNEXUS_CLOUD_TASK_KIND" == "full_validation" ]]; then
            test "$TEST_OUTCOME" = "success"
          fi
          if [[ "$CKNEXUS_CLOUD_TASK_KIND" == "security" || "$CKNEXUS_CLOUD_TASK_KIND" == "full_validation" ]]; then
            test "$SECURITY_OUTCOME" = "success"
          fi
