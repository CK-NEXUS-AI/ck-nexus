name: PR46 Ruff Autofix

on:
  push:
    branches:
      - fix/pr46-cknexus-ci-ruff-v1

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync locked environment
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen

      - name: Ruff safe and mechanical fixes
        run: |
          FILES=(
            creator_app/api.py
            creator_app/assistant_registry.py
            creator_app/free_providers.py
            creator_app/provider_hub.py
            creator_app/provider_registry.py
            creator_app/providers_enhanced.py
            scripts/production_readiness.py
            scripts/provider_test.py
            tests/test_free_providers.py
          )
          .venv/bin/ruff check "${FILES[@]}" --fix --unsafe-fixes || true
          .venv/bin/ruff format "${FILES[@]}"
          .venv/bin/ruff check "${FILES[@]}" --output-format=github

      - name: Commit autofix
        run: |
          if git diff --quiet; then
            echo "No Ruff changes to commit"
            exit 0
          fi
          git config user.name "ck-nexus-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            creator_app/api.py \
            creator_app/assistant_registry.py \
            creator_app/free_providers.py \
            creator_app/provider_hub.py \
            creator_app/provider_registry.py \
            creator_app/providers_enhanced.py \
            scripts/production_readiness.py \
            scripts/provider_test.py \
            tests/test_free_providers.py
          git commit -m "chore: apply scoped Ruff autofix for PR46"
          git push origin HEAD:fix/pr46-cknexus-ci-ruff-v1
