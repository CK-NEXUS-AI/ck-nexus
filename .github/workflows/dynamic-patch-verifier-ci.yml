name: Dynamic Patch Verifier Post-P0 CI

on:
  pull_request:
    paths:
      - 'creator_app/dynamic_verifier/**'
      - '.github/workflows/dynamic-patch-verifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Dynamic verifier tests
        run: .venv/bin/pytest -q creator_app/dynamic_verifier/tests
      - name: Static verifier regression
        run: .venv/bin/pytest -q creator_app/patch_verifier/tests
      - name: Ruff
        run: .venv/bin/ruff check creator_app/dynamic_verifier --output-format=github
      - name: Bandit reviewed severity gate
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/bandit creator_app/dynamic_verifier/verifier.py -f json -o /tmp/dynamic-bandit.json || true
          .venv/bin/python - <<'PY'
          import json, sys
          report=json.load(open('/tmp/dynamic-bandit.json',encoding='utf-8'))
          blocking=[x for x in report.get('results',[]) if x.get('issue_severity') in {'MEDIUM','HIGH'}]
          print(f"bandit_blocking_findings={len(blocking)}")
          if blocking:
              print(json.dumps(blocking,indent=2,sort_keys=True))
          sys.exit(bool(blocking))
          PY
      - name: Secret scan
        run: .venv/bin/python scripts/secret_scan.py
      - name: Isolation assertions
        shell: bash
        run: |
          set -euo pipefail
          kernel=creator_app/dynamic_verifier/verifier.py
          ! grep --line-number -E 'shell=True|os\.system\(|--privileged|docker\.sock' "$kernel"
          grep -q -- '"--pull=never"' "$kernel"
          grep -q -- '"--network=none"' "$kernel"
          grep -q -- '"--read-only"' "$kernel"
          grep -q -- '"--cap-drop=ALL"' "$kernel"
          grep -q -- '"--security-opt=no-new-privileges"' "$kernel"
          grep -q -- 'credential_forwarding' "$kernel"
          grep -q -- 'patched_code_executed_on_host' "$kernel"
          grep -q -- 'patch_applied_to_canonical_checkout' "$kernel"
      - name: Production boundary
        run: |
          echo 'Dynamic verifier code is Post-P0 development infrastructure only.'
          echo 'CI tests the kernel with a stubbed verifier-container invocation; no trusted verifier image is claimed here.'
          echo 'A real VERIFIED_DYNAMIC result requires an independently reviewed digest-pinned verifier image at runtime.'
          echo 'No Q10/Q11/Q12 promotion; Production remains NO-GO; PR #14 is unchanged.'
