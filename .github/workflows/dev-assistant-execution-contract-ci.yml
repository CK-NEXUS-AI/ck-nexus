name: Development Assistant Execution Contract CI

on:
  pull_request:
    paths:
      - 'creator_app/dev_assistants/**'
      - 'creator_app/agnes/mcp_server.py'
      - 'docs/DEV_ASSISTANT_EXECUTION_CONTRACT_V1.md'
      - '.github/workflows/dev-assistant-execution-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Execution contract tests
        run: .venv/bin/pytest -q creator_app/dev_assistants/tests/test_execution.py
      - name: Full development assistant tests
        run: .venv/bin/pytest -q creator_app/dev_assistants/tests
      - name: Ruff
        run: >-
          .venv/bin/ruff check
          creator_app/dev_assistants
          creator_app/agnes/mcp_server.py
          --output-format=github
      - name: Bandit reviewed severity gate
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/bandit -r \
            creator_app/dev_assistants \
            creator_app/agnes/mcp_server.py \
            -f json -o /tmp/dev-execution-bandit.json || true
          .venv/bin/python - <<'PY'
          import json
          import sys

          with open('/tmp/dev-execution-bandit.json', encoding='utf-8') as handle:
              report = json.load(handle)
          blocking = [
              item
              for item in report.get('results', [])
              if item.get('issue_severity') in {'MEDIUM', 'HIGH'}
          ]
          print(f"bandit_blocking_findings={len(blocking)}")
          if blocking:
              print(json.dumps(blocking, indent=2, sort_keys=True))
          sys.exit(bool(blocking))
          PY
      - name: Secret scan
        run: .venv/bin/python scripts/secret_scan.py
      - name: Contract remains non-executing
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E \
            'subprocess\.|os\.system\(|shell=True|execFile|Popen\(' \
            creator_app/dev_assistants
          echo 'No provider execution primitive exists in the contract package.'
      - name: MCP execution-plan smoke
        shell: bash
        run: |
          set -euo pipefail
          export CKNEXUS_UNIVERSAL_MCP_HOST=127.0.0.1
          export CKNEXUS_UNIVERSAL_MCP_PORT=8765
          .venv/bin/python -m creator_app.agnes.mcp_server >/tmp/cknexus-mcp.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          .venv/bin/python - <<'PY'
          import asyncio

          from mcp import ClientSession
          from mcp.client.streamable_http import streamablehttp_client

          async def verify() -> None:
              last_error = None
              for _ in range(30):
                  try:
                      async with streamablehttp_client(
                          'http://127.0.0.1:8765/mcp'
                      ) as (read_stream, write_stream, _):
                          async with ClientSession(read_stream, write_stream) as session:
                              await session.initialize()
                              tools = await session.list_tools()
                              names = {tool.name for tool in tools.tools}
                              if 'cknexus_dev_execution_plan' not in names:
                                  raise AssertionError('execution-plan MCP tool missing')
                              result = await session.call_tool(
                                  'cknexus_dev_execution_plan',
                                  {
                                      'assistant_id': 'aider',
                                      'task': 'Review one isolated change',
                                      'workstream_id': 'ci-smoke',
                                  },
                              )
                              if result.isError:
                                  raise AssertionError('execution-plan tool returned error')
                              print('execution-plan MCP tool verified')
                              return
                  except Exception as exc:
                      last_error = exc
                      await asyncio.sleep(0.5)
              raise RuntimeError(f'MCP smoke failed: {last_error}')

          asyncio.run(verify())
          PY
      - name: Production boundary
        run: |
          echo 'Execution contract is Post-P0 development evidence only.'
          echo 'It does not execute assistants or promote Q10/Q11/Q12.'
          echo 'PR #14 remains outside this workflow.'
