name: Connector and Observability Post-P0 CI

on:
  pull_request:
    paths:
      - 'creator_app/connector_fabric_v2/**'
      - 'creator_app/channel_continuity/**'
      - 'creator_app/proactive_assistant/**'
      - 'creator_app/tool_trust/**'
      - 'creator_app/observability_v2/**'
      - 'creator_app/evaluation_framework/**'
      - 'creator_app/data_governance/**'
      - 'tests/test_connector_observability_v1.py'
      - '.github/workflows/connector-observability-post-p0-ci.yml'
  push:
    branches: [main]
    paths:
      - 'creator_app/connector_fabric_v2/**'
      - 'creator_app/channel_continuity/**'
      - 'creator_app/proactive_assistant/**'
      - 'creator_app/tool_trust/**'
      - 'creator_app/observability_v2/**'
      - 'creator_app/evaluation_framework/**'
      - 'creator_app/data_governance/**'
      - 'tests/test_connector_observability_v1.py'
      - '.github/workflows/connector-observability-post-p0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Connector and observability tests
        run: .venv/bin/pytest -q tests/test_connector_observability_v1.py
      - name: Cognitive and data-plane regression
        run: |
          .venv/bin/pytest -q tests/test_cognitive_governor_v1.py
          .venv/bin/pytest -q tests/test_personal_data_plane_v1.py
      - name: Ruff
        run: |
          .venv/bin/ruff check \
            creator_app/connector_fabric_v2 \
            creator_app/channel_continuity \
            creator_app/proactive_assistant \
            creator_app/tool_trust \
            creator_app/observability_v2 \
            creator_app/evaluation_framework \
            creator_app/data_governance \
            tests/test_connector_observability_v1.py \
            --output-format=github
      - name: Bandit reviewed severity gate
        run: |
          set -euo pipefail
          .venv/bin/bandit -q -r \
            creator_app/connector_fabric_v2 \
            creator_app/channel_continuity \
            creator_app/proactive_assistant \
            creator_app/tool_trust \
            creator_app/observability_v2 \
            creator_app/evaluation_framework \
            creator_app/data_governance \
            -f json -o connector-observability-bandit.json || true
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('connector-observability-bandit.json').read_text())
          blocking = [
              item for item in data.get('results', [])
              if item.get('issue_severity') in {'MEDIUM', 'HIGH'}
          ]
          print(f'blocking_findings={len(blocking)}')
          if blocking:
              for item in blocking:
                  print(item.get('filename'), item.get('line_number'), item.get('test_id'))
              raise SystemExit(1)
          PY
      - name: Secret scan
        run: |
          set -euo pipefail
          ! git grep -nEI -- '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- \
            creator_app/connector_fabric_v2 \
            creator_app/channel_continuity \
            creator_app/proactive_assistant \
            creator_app/tool_trust \
            creator_app/observability_v2 \
            creator_app/evaluation_framework \
            creator_app/data_governance \
            tests/test_connector_observability_v1.py
      - name: Lifecycle and privacy invariants
        run: |
          set -euo pipefail
          grep -R --line-number 'DISCOVERED' creator_app/connector_fabric_v2
          grep -R --line-number 'QUARANTINED' creator_app/tool_trust
          grep -R --line-number 'telemetry cannot claim security-audit authority' creator_app/observability_v2
          grep -R --line-number 'explicit_approval_required' creator_app/proactive_assistant
          grep -R --line-number 'StorageMode.FORBIDDEN' creator_app/data_governance
      - name: Production boundary
        run: |
          echo 'Connector/continuity/proactive/observability/evaluation are Post-P0 development infrastructure.'
          echo 'No Q10/Q11/Q12 promotion. PR #14 remains untouched. Production NO-GO.'
