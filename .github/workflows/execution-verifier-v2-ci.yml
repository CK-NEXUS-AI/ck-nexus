name: Execution and Trusted Verifier V2 Post-P0 CI

on:
  pull_request:
    paths:
      - 'creator_app/execution_fabric_v2/**'
      - 'creator_app/trusted_verifier_v2/**'
      - 'tests/test_execution_verifier_v2.py'
      - '.github/workflows/execution-verifier-v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'creator_app/execution_fabric_v2/**'
      - 'creator_app/trusted_verifier_v2/**'
      - 'tests/test_execution_verifier_v2.py'
      - '.github/workflows/execution-verifier-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: V2 execution and verifier tests
        run: .venv/bin/pytest -q tests/test_execution_verifier_v2.py
      - name: V1 sandbox and verifier regression
        run: |
          .venv/bin/pytest -q creator_app/sandbox_executor/tests
          .venv/bin/pytest -q creator_app/dynamic_verifier/tests
          .venv/bin/pytest -q creator_app/patch_verifier/tests
      - name: Ruff
        run: |
          .venv/bin/ruff check \
            creator_app/execution_fabric_v2 \
            creator_app/trusted_verifier_v2 \
            tests/test_execution_verifier_v2.py \
            --output-format=github
      - name: Bandit reviewed severity gate
        run: |
          set -euo pipefail
          .venv/bin/bandit -q -r \
            creator_app/execution_fabric_v2 \
            creator_app/trusted_verifier_v2 \
            -f json -o execution-verifier-v2-bandit.json || true
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('execution-verifier-v2-bandit.json').read_text())
          blocking = [
              item for item in data.get('results', [])
              if item.get('issue_severity') in {'MEDIUM', 'HIGH'}
          ]
          print(f'blocking_findings={len(blocking)}')
          if blocking:
              for item in blocking:
                  print(item.get('filename'), item.get('line_number'), item.get('test_id'))
              raise SystemExit(1)
          PY
      - name: Secret scan
        run: |
          set -euo pipefail
          ! git grep -nEI -- '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- \
            creator_app/execution_fabric_v2 \
            creator_app/trusted_verifier_v2 \
            tests/test_execution_verifier_v2.py
      - name: Execution authority invariants
        run: |
          set -euo pipefail
          grep -R --line-number 'wildcard network access is forbidden' creator_app/execution_fabric_v2
          grep -R --line-number 'cred://' creator_app/execution_fabric_v2
          grep -R --line-number 'release-authorized lease' creator_app/execution_fabric_v2
          grep -R --line-number 'revoked verifier cannot be reactivated' creator_app/trusted_verifier_v2
          grep -R --line-number 'policy digest mismatch' creator_app/trusted_verifier_v2
      - name: Production boundary
        run: |
          echo 'Execution Fabric V2 and Trusted Verifier V2 are Post-P0 development infrastructure.'
          echo 'They do not satisfy Native Q10, Q11 or Q12. PR #14 remains untouched. Production NO-GO.'
