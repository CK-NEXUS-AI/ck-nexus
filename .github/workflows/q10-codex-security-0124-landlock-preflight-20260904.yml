name: Q10 Codex Security 0.1.24 Landlock Preflight 2026-09-04

on:
  push:
    branches:
      - ops/q10-host-qualification-20260904
      - ops/q10-landlock-preflight-run-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landlock-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      Q10_SUBJECT: 39f5c1adb9d761ab418cf088ff1f051b1ca731d1
      Q10_TREE: 0525195934f703a8becf8a39f6397b2411e0bb2e
      CODEX_SECURITY_SOURCE: d4b7d29a87cb86c9072f7905ba867d02385d8fd3
      LOCAL_IMAGE: codex-security:0.1.24-source-d4b7d29
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4

      - name: Materialize frozen Q10 subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.Q10_SUBJECT }}
          path: frozen-source
          fetch-depth: 1

      - name: Verify exact frozen subject binding
        shell: bash
        run: |
          set -euo pipefail
          actual_subject="$(git -C frozen-source rev-parse HEAD)"
          actual_tree="$(git -C frozen-source rev-parse HEAD^{tree})"
          test "$actual_subject" = "$Q10_SUBJECT"
          test "$actual_tree" = "$Q10_TREE"
          test -z "$(git -C frozen-source status --porcelain)"
          printf 'subject=%s\ntree=%s\nbinding=PASS\n' "$actual_subject" "$actual_tree" | tee subject-binding.txt

      - name: Checkout exact OpenAI Codex Security 0.1.24 source
        uses: actions/checkout@v4
        with:
          repository: openai/codex-security
          ref: ${{ env.CODEX_SECURITY_SOURCE }}
          path: codex-security-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify upstream release identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C codex-security-source rev-parse HEAD)"
          test "$actual" = "$CODEX_SECURITY_SOURCE"
          version="$(python3 - <<'PY'
import json
with open('codex-security-source/sdk/typescript/package.json', encoding='utf-8') as f:
    print(json.load(f)['version'])
PY
)"
          test "$version" = '0.1.24'
          printf 'source_commit=%s\npackage_version=%s\nsource_identity=PASS\n' "$actual" "$version" | tee scanner-source-identity.txt

      - name: Build exact scanner target from source
        shell: bash
        run: |
          set -euo pipefail
          docker build --target scanner -t "$LOCAL_IMAGE" codex-security-source
          docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}' | tee local-image-id.txt
          docker run --rm "$LOCAL_IMAGE" --version | tee codex-security-version.txt
          sha256sum codex-security-source/docker/codex-security-seccomp.json | tee seccomp-sha256.txt

      - name: Verify supported hardened sandbox fallback
        shell: bash
        run: |
          set -euo pipefail
          seccomp="$GITHUB_WORKSPACE/codex-security-source/docker/codex-security-seccomp.json"
          command=(docker run --rm --cap-drop ALL --security-opt no-new-privileges --security-opt "seccomp=$seccomp" --entrypoint node "$LOCAL_IMAGE" /usr/local/lib/node_modules/@openai/codex-security/node_modules/@openai/codex/bin/codex.js)
          set +e
          output="$("${command[@]}" sandbox /usr/bin/true 2>&1)"
          default_rc=$?
          set -e
          printf '%s\n' "$output" > sandbox-default.txt
          printf 'default_sandbox_rc=%s\n' "$default_rc" | tee sandbox-status.txt
          if [ "$default_rc" -eq 0 ]; then
            echo 'sandbox_path=DEFAULT_PASS' | tee -a sandbox-status.txt
          elif grep -Eq 'bwrap: (Failed to make / slave: Permission denied|loopback: Failed RTM_NEW(ADDR|LINK): Operation not permitted|setting up uid map: Permission denied|No permissions to create a new namespace)' <<< "$output"; then
            set +e
            landlock_output="$("${command[@]}" sandbox --enable use_legacy_landlock /usr/bin/true 2>&1)"
            landlock_rc=$?
            set -e
            printf '%s\n' "$landlock_output" > sandbox-landlock.txt
            printf 'landlock_rc=%s\n' "$landlock_rc" | tee -a sandbox-status.txt
            test "$landlock_rc" -eq 0
            echo 'sandbox_path=SUPPORTED_LEGACY_LANDLOCK_PASS' | tee -a sandbox-status.txt
          else
            printf '%s\n' "$output" >&2
            echo 'sandbox_path=UNEXPECTED_FAILURE' | tee -a sandbox-status.txt
            exit 1
          fi

      - name: Verify external-provider CLI plumbing without credentials or network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-dry-run"
          docker run --rm --volume "$GITHUB_WORKSPACE/frozen-source:/input/repository:ro" --volume "$RUNNER_TEMP/provider-dry-run:/output" "$LOCAL_IMAGE" scan /input/repository --provider openrouter --model anthropic/claude-sonnet-4.5 --output-dir /output/openrouter --dry-run > provider-openrouter-dry-run.txt 2>&1
          printf 'provider_openrouter_dry_run=PASS\ncredential_used=NO\nnetwork_scan_started=NO\n' | tee provider-status.txt

      - name: Record classification
        shell: bash
        run: |
          set -euo pipefail
          printf 'classification=TECHNICAL_COMPATIBILITY_PREFLIGHT_ONLY\nscanner=codex-security\nscanner_version=0.1.24\nscanner_source=%s\ndeep_scan_started=NO\ncredential_used=NO\nquota_consumption_intended=NO\nauthority=NONE\nq10_status=NOT_VERIFIED\nproduction=NO_GO\n' "$CODEX_SECURITY_SOURCE" | tee classification.txt

      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          set +e
          files=(subject-binding.txt scanner-source-identity.txt local-image-id.txt codex-security-version.txt seccomp-sha256.txt sandbox-default.txt sandbox-landlock.txt sandbox-status.txt provider-openrouter-dry-run.txt provider-status.txt classification.txt)
          for f in "${files[@]}"; do [ -f "$f" ] && sha256sum "$f"; done | tee SHA256SUMS

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q10-codex-security-0124-landlock-preflight
          path: |
            subject-binding.txt
            scanner-source-identity.txt
            local-image-id.txt
            codex-security-version.txt
            seccomp-sha256.txt
            sandbox-default.txt
            sandbox-landlock.txt
            sandbox-status.txt
            provider-openrouter-dry-run.txt
            provider-status.txt
            classification.txt
            SHA256SUMS
          if-no-files-found: warn
