name: Verify Sale Q11 OpenAI Live
on:
  workflow_dispatch:
  push:
    branches: [verify/sale-gates-20260922]
jobs:
  q11:
    runs-on: [self-hosted, Linux, X64, cknexus-q12]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 762d76bc2adefb3d98f885da20300289b9b08697
          fetch-depth: 1
      - name: Verify exact sale source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "762d76bc2adefb3d98f885da20300289b9b08697"
      - name: OpenAI live smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: gpt-5-mini
        run: |
          set -euo pipefail
          python3 scripts/test_openai_live.py | tee Q11_OPENAI_LIVE.txt
          grep -q 'CK-NEXUS-P0-SMOKE-PASS' Q11_OPENAI_LIVE.txt
      - name: Emit evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          out=open("Q11_OPENAI_LIVE.txt",encoding="utf-8").read()
          source=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          ev={"gate":"Q11","source_sha":source,"source_tree_sha":tree,"result":"PASS","production_promotion_allowed":True,"smoke_output_sha256":hashlib.sha256(out.encode()).hexdigest()}
          json.dump(ev,open("Q11_OPENAI_LIVE.json","w"),indent=2); open("Q11_OPENAI_LIVE.json","a").write("\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q11-sale-${{ github.run_id }}
          path: |
            Q11_OPENAI_LIVE.json
            Q11_OPENAI_LIVE.txt
