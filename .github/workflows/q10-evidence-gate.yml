name: Q10 Evidence Gate (EG-1..EG-4) on self-hosted runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  Q10_TARGET_SHA: 512837c8b1a3e6e8e844252a1b0781d8de011b07
  Q10_TARGET_TREE: 43f9cb9691a0d028a1ef396a0a475c5cd80c4a99
  Q10_OUT_DIR: ${{ github.workspace }}/q10-evidence

jobs:
  evidence-gate:
    runs-on: [self-hosted, linux, cknexus-q12]
    steps:
      - name: Prove non-root runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_user=$(id -un)"
          echo "runner_uid=$(id -u)"
          test "$(id -u)" -ne 0
      - name: Checkout exact Q10 closure target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.Q10_TARGET_SHA }}
          fetch-depth: 1
      - name: Verify canonical HEAD and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$Q10_TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$Q10_TARGET_TREE"
          echo "Q10 canonical target verified: $Q10_TARGET_SHA"
      - name: Fetch evidence gate script from main
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/spinlnw10-art/ck-nexus/contents/evidence/q10/q10_evidence_gate.sh?ref=main" \
            | jq -r '.content' | base64 -d > q10_evidence_gate.sh
          bash -n q10_evidence_gate.sh
          echo "script fetched and syntax-checked"
      - name: Run Q10 evidence gate (EG-1..EG-4)
        id: gate
        shell: bash
        run: |
          set +e
          bash q10_evidence_gate.sh "$GITHUB_WORKSPACE" > q10-gate-output.txt 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record EG-5 BLOCKED and summarize
        shell: bash
        run: |
          set -euo pipefail
          echo "EG-5 = BLOCKED (Codex Security research preview, not free)" | tee -a q10-gate-output.txt
          echo "--- evidence files ---"
          ls -la "$Q10_OUT_DIR" || true
          echo "--- manifest ---"
          cat "$Q10_OUT_DIR/evidence_manifest.json" 2>/dev/null || echo "(no manifest)"
      - name: Upload Q10 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q10-evidence-${{ env.Q10_TARGET_SHA }}
          path: |
            q10-gate-output.txt
            q10-evidence/
          if-no-files-found: warn
