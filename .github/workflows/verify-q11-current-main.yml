name: Verify Q11 current main release subject

on:
  push:
    branches:
      - verify/q11-main-944d7cb-20261120

permissions:
  contents: read

env:
  Q11_SOURCE_SHA: 944d7cb70a5d59d53c8fb379752bbee2085f7c8c
  Q11_SOURCE_TREE: 55bc545e5afd6379c46a464608601efeef213a6a
  Q11_RELEASE_SUBJECT: 3d7371215bae7bdc24f77a7abaddb5104ec0437d6a405a59f5e1a08ff8a80005

jobs:
  q11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current-main candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.Q11_SOURCE_SHA }}
          fetch-depth: 1

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify exact source and runtime subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$Q11_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$Q11_SOURCE_TREE"
          subject=$(git ls-tree -r HEAD -- app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          test "$subject" = "$Q11_RELEASE_SUBJECT"
          python -m pip install "uv==0.12.4"
          uv lock --check
          uv sync --all-extras --dev --frozen

      - name: Run exact-subject OpenAI Responses API smoke
        id: smoke
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: ${{ vars.OPENAI_SMOKE_MODEL || 'gpt-5-mini' }}
        run: |
          set +e
          .venv/bin/python scripts/test_openai_live.py > q11-output.txt 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit sanitized Q11 evidence
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RC: ${{ steps.smoke.outputs.rc }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path

          rc_text = os.getenv("RC", "")
          rc = int(rc_text) if rc_text.isdigit() else 2
          output = Path("q11-output.txt").read_text(encoding="utf-8") if Path("q11-output.txt").exists() else ""
          secret = os.getenv("OPENAI_API_KEY", "").strip()
          diagnostic = output[:500].replace(secret, "[REDACTED]") if secret else output[:500]
          sentinel = "CK-NEXUS-P0-SMOKE-PASS" in output
          result = "PASS" if rc == 0 and sentinel else ("BLOCKED" if rc == 2 else "FAIL")
          evidence = {
              "schema_version": 1,
              "gate": "Q11",
              "source_sha": os.environ["Q11_SOURCE_SHA"],
              "source_tree": os.environ["Q11_SOURCE_TREE"],
              "release_subject_manifest_sha256": os.environ["Q11_RELEASE_SUBJECT"],
              "github_run_id": int(os.environ["RUN_ID"]),
              "checked_at": datetime.now(UTC).isoformat(),
              "credential_configured": bool(secret),
              "credential_exposed": False,
              "model": os.getenv("OPENAI_SMOKE_MODEL", "gpt-5-mini"),
              "sentinel_observed": sentinel,
              "result": result,
              "production_promotion_allowed": False,
              "diagnostic": diagnostic or "No smoke output",
          }
          Path("Q11_OPENAI_LIVE.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({k: v for k, v in evidence.items() if k != "diagnostic"}, indent=2, sort_keys=True))
          PY

      - name: Upload exact-subject Q11 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q11-current-main-944d7cb
          path: Q11_OPENAI_LIVE.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Q11
        run: test '${{ steps.smoke.outputs.rc }}' -eq 0
