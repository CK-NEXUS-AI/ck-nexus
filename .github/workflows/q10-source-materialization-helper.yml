name: Q10 Read-Only Source Materialization Helper

on:
  push:
    branches:
      - ops/q10-source-materialization-helper
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-frozen-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen Q10 subject
        uses: actions/checkout@v4
        with:
          repository: spinlnw10-art/ck-nexus
          ref: 39f5c1adb9d761ab418cf088ff1f051b1ca731d1
          fetch-depth: 0
          path: source

      - name: Verify exact SHA and tree
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git -C source rev-parse HEAD)"
          TREE_SHA="$(git -C source rev-parse 'HEAD^{tree}')"
          test "$HEAD_SHA" = "39f5c1adb9d761ab418cf088ff1f051b1ca731d1"
          test "$TREE_SHA" = "0525195934f703a8becf8a39f6397b2411e0bb2e"
          {
            echo "repository=spinlnw10-art/ck-nexus"
            echo "target_sha=$HEAD_SHA"
            echo "target_tree_sha=$TREE_SHA"
            echo "materialization_mode=github-actions-read-only"
          } > q10-source-identity.txt

      - name: Package exact source without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf q10-frozen-source-39f5c1adb9d7.tar.gz -C source .
          sha256sum q10-frozen-source-39f5c1adb9d7.tar.gz | tee q10-frozen-source.sha256

      - name: Upload frozen source artifact
        uses: actions/upload-artifact@v4
        with:
          name: q10-frozen-source-39f5c1adb9d7
          path: |
            q10-frozen-source-39f5c1adb9d7.tar.gz
            q10-frozen-source.sha256
            q10-source-identity.txt
          if-no-files-found: error
          retention-days: 3
