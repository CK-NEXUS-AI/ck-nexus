name: CK-NEXUS Phase 0 Governed Runtime

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'runtime/executor/**'
      - 'tests/contracts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/phase0-governed-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Compile Phase 0
        run: .venv/bin/python -m compileall -q contracts runtime/executor tests/contracts
      - name: Ruff Phase 0
        run: .venv/bin/ruff check contracts runtime/executor tests/contracts --output-format=github
      - name: Phase 0 tests
        run: .venv/bin/pytest -q tests/contracts
