name: Universal AI Gateway Post-P0 CI

on:
  pull_request:
    paths:
      - 'creator_app/ai_gateway/**'
      - '.github/workflows/ai-gateway-post-p0-ci.yml'
  push:
    branches: [main]
    paths:
      - 'creator_app/ai_gateway/**'
      - '.github/workflows/ai-gateway-post-p0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Frozen dependency sync
        run: |
          uv lock --check
          uv sync --all-extras --dev --frozen
      - name: Gateway tests
        run: .venv/bin/pytest -q creator_app/ai_gateway/tests
      - name: Ruff
        run: .venv/bin/ruff check creator_app/ai_gateway --output-format=github
      - name: Bandit reviewed severity gate
        run: |
          set -euo pipefail
          .venv/bin/bandit -q -r creator_app/ai_gateway -f json -o ai-gateway-bandit.json || true
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('ai-gateway-bandit.json').read_text())
          blocking = [
              item for item in data.get('results', [])
              if item.get('issue_severity') in {'MEDIUM', 'HIGH'}
          ]
          print(f'blocking_findings={len(blocking)}')
          if blocking:
              for item in blocking:
                  print(item.get('filename'), item.get('line_number'), item.get('test_id'))
              raise SystemExit(1)
          PY
      - name: Secret scan
        run: |
          set -euo pipefail
          ! git grep -nEI -- '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- creator_app/ai_gateway
      - name: Gateway invariants
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'OPENAI_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY|GROQ_API_KEY|MISTRAL_API_KEY|OPENROUTER_API_KEY' creator_app/ai_gateway
          grep -R --line-number 'credential_material_in_route' creator_app/ai_gateway/gateway.py
          grep -R --line-number 'runtime_adapter_discovery' creator_app/ai_gateway/gateway.py
      - name: Production boundary
        run: |
          echo 'Universal AI Gateway is Post-P0 development infrastructure.'
          echo 'No Q10/Q11/Q12 promotion. PR #14 remains untouched. Production NO-GO.'
