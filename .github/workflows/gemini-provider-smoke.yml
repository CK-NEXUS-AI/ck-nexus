name: CK-NEXUS Gemini provider smoke

on:
  push:
    branches: [feat/gemini-provider-20261119]
    paths:
      - '.github/workflows/gemini-provider-smoke.yml'
      - 'scripts/test_gemini_live.py'
      - 'creator_app/providers.py'
      - 'creator_app/credentials/credential_broker.py'
      - 'tests/test_provider_adapters.py'

permissions:
  contents: read

concurrency:
  group: gemini-provider-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile provider and smoke script
        run: python -m compileall -q creator_app scripts/test_gemini_live.py
      - name: Run Gemini live smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_EVIDENCE_PATH: gemini-live-evidence.json
        run: python scripts/test_gemini_live.py
      - name: Publish sanitized result
        if: always()
        run: |
          if [ -f gemini-live-evidence.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          row=json.loads(Path('gemini-live-evidence.json').read_text())
          print('## Gemini provider smoke')
          print(f"- Result: **{row['result']}**")
          print(f"- Provider/model: `{row['provider']}` / `{row['model']}`")
          print(f"- Credential configured: `{row['credential_configured']}`")
          print(f"- Expected response observed: `{row['sentinel_observed']}`")
          print(f"- Diagnostic: {row['diagnostic']}")
          PY
          else
            echo 'Gemini evidence was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized smoke evidence
        if: always() && hashFiles('gemini-live-evidence.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ck-nexus-gemini-smoke-${{ github.sha }}
          path: gemini-live-evidence.json
          if-no-files-found: error
          retention-days: 30
