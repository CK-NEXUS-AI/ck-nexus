name: Q11 Live Smoke Contract CI

on:
  pull_request:
    paths:
      - '.github/workflows/q11-live-provider-smoke.yml'
      - '.github/workflows/q11-live-smoke-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate fail-closed Q11 workflow contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/q11-live-provider-smoke.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              'workflow_dispatch:',
              'confirm_runtime_sha:',
              'confirm_runtime_subject:',
              '39f5c1adb9d761ab418cf088ff1f051b1ca731d1',
              '0525195934f703a8becf8a39f6397b2411e0bb2e',
              '89f2925cd871332b16f755f0dae1e058826c38b728f66d2001f2eaaec6301a52',
              "codex_security_deep_scan'] == 'PASS'",
              "production_promotion_allowed'] is True",
              'codex_security_report_sha256',
              'timeout 180s',
              "grep -q 'P0-AI-001 PASS'",
              "grep -q 'CK-NEXUS-P0-SMOKE-PASS'",
              'credential literal detected in captured smoke output',
              "raw_provider_output_persisted': False",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing Q11 hardening requirements: {missing}')
          if 'cat ../q11-smoke.log' in text:
              raise SystemExit('raw provider output must not be echoed')
          q10_index = text.index('Enforce Q10 native Deep Scan prerequisite')
          provider_index = text.index('Run live provider sentinel smoke')
          if q10_index >= provider_index:
              raise SystemExit('Q10 prerequisite must execute before provider access')
          upload = text.split('- uses: actions/upload-artifact@v4', maxsplit=1)[1]
          if 'q11-smoke.log' in upload:
              raise SystemExit('raw provider output must not be persisted as an artifact')
          if 'Q11_SMOKE_SUMMARY.json' not in upload:
              raise SystemExit('sanitized Q11 summary artifact is required')
          print('Q11_LIVE_SMOKE_CONTRACT=PASS')
          PY
      - name: Prove production evidence was not modified
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}"...HEAD -- \
            evidence/Q10_DEPENDENCY_AUDIT.json \
            evidence/Q11_OPENAI_LIVE.json \
            evidence/Q12_CGROUP_V2.json
