name: Verify Q12 final release subject on delegated self-hosted Linux

on:
  workflow_dispatch:
    inputs:
      expected_verifier_sha:
        description: Exact reviewed verifier harness commit SHA to execute
        required: true
        type: string
      expected_verifier_tree:
        description: Exact reviewed verifier harness tree SHA to execute
        required: true
        type: string
      confirm_application_subject:
        description: Type the exact frozen application subject digest to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: q12-final-subject
  cancel-in-progress: false

env:
  Q12_SOURCE_SHA: 39f5c1adb9d761ab418cf088ff1f051b1ca731d1
  Q12_SOURCE_TREE: 0525195934f703a8becf8a39f6397b2411e0bb2e
  Q12_RELEASE_SUBJECT: 89f2925cd871332b16f755f0dae1e058826c38b728f66d2001f2eaaec6301a52
  Q12_APPLICATION_SUBJECT: dff89dc7fa9cd6e40480c3344f688a75383ec798929efe23f3a29c79d1186cec
  CKNEXUS_ENVIRONMENT: staging
  CKNEXUS_AGNES_CGROUP_ROOT: ${{ vars.CKNEXUS_AGNES_CGROUP_ROOT }}

jobs:
  q12:
    runs-on: [self-hosted, linux, cknexus-q12]
    timeout-minutes: 15
    steps:
      - name: Prove non-root runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_user=$(id -un)"
          echo "runner_uid=$(id -u)"
          test "$(id -u)" -ne 0

      - name: Checkout verifier/operator pack
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: operator
          fetch-depth: 0

      - name: Bind reviewed verifier harness identity before mutation
        env:
          EXPECTED_VERIFIER_SHA: ${{ inputs.expected_verifier_sha }}
          EXPECTED_VERIFIER_TREE: ${{ inputs.expected_verifier_tree }}
          CONFIRM_APPLICATION_SUBJECT: ${{ inputs.confirm_application_subject }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_VERIFIER_SHA"
          test -n "$EXPECTED_VERIFIER_TREE"
          test "$CONFIRM_APPLICATION_SUBJECT" = "$Q12_APPLICATION_SUBJECT"
          actual_sha=$(git -C operator rev-parse HEAD)
          actual_tree=$(git -C operator rev-parse HEAD^{tree})
          test "$actual_sha" = "$EXPECTED_VERIFIER_SHA"
          test "$actual_tree" = "$EXPECTED_VERIFIER_TREE"
          printf '%s\n' "$EXPECTED_VERIFIER_SHA" > q12-expected-verifier-sha.txt
          printf '%s\n' "$EXPECTED_VERIFIER_TREE" > q12-expected-verifier-tree.txt
          printf '%s\n' "$actual_sha" > q12-verifier-sha.txt
          printf '%s\n' "$actual_tree" > q12-verifier-tree.txt
          printf '%s\n' "$Q12_APPLICATION_SUBJECT" > q12-application-subject.txt

      - name: Checkout exact frozen candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.Q12_SOURCE_SHA }}
          path: runtime
          fetch-depth: 1

      - name: Verify immutable release subject
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$Q12_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$Q12_SOURCE_TREE"
          subject=$(git ls-tree -r HEAD -- app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          test "$subject" = "$Q12_RELEASE_SUBJECT"
          python3 --version

      - name: Verify true delegated cgroup v2 boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CKNEXUS_AGNES_CGROUP_ROOT:-}"
          test "$CKNEXUS_AGNES_CGROUP_ROOT" != "/sys/fs/cgroup"
          test -d "$CKNEXUS_AGNES_CGROUP_ROOT"
          test -w "$CKNEXUS_AGNES_CGROUP_ROOT"
          test -f "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.controllers"
          test -f "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.subtree_control"
          for controller in cpu memory pids; do
            grep -qw "$controller" "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.controllers"
            tr ' ' '\n' < "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.subtree_control" | sed 's/^[+-]//' | grep -qx "$controller"
          done
          printf '%s\n' "$CKNEXUS_AGNES_CGROUP_ROOT" > q12-delegated-root.txt
          cat "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.controllers" > q12-controllers.txt
          cat "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.subtree_control" > q12-subtree-control.txt
          printf '%s\n' "$(id -un)" > q12-runner-user.txt

      - name: Verify configured limits and child attachment using frozen runtime gate
        id: gate
        working-directory: runtime
        shell: bash
        run: |
          set +e
          python3 scripts/agnes_cgroup_v2_staging_gate.py >../Q12_CGROUP_RAW.json 2>../q12-gate-error.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove active CPU, memory, and PID kernel enforcement
        id: active
        shell: bash
        run: |
          set +e
          python3 operator/.github/release-tools/q12_active_cgroup_enforcement_probe.py \
            --root "$CKNEXUS_AGNES_CGROUP_ROOT" \
            >Q12_ACTIVE_ENFORCEMENT.json 2>q12-active-error.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit exact Q12 evidence
        env:
          RUN_ID: ${{ github.run_id }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GATE_RC: ${{ steps.gate.outputs.rc }}
          ACTIVE_RC: ${{ steps.active.outputs.rc }}
        shell: bash
        run: |
          python3 - "$Q12_SOURCE_SHA" "$Q12_SOURCE_TREE" "$Q12_RELEASE_SUBJECT" "$Q12_APPLICATION_SUBJECT" "$RUN_ID" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sha, tree, subject, application_subject, run_id = sys.argv[1:]
          gate_rc = int(os.getenv('GATE_RC', '1'))
          active_rc = int(os.getenv('ACTIVE_RC', '1'))

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (FileNotFoundError, json.JSONDecodeError):
                  return None

          raw = load('Q12_CGROUP_RAW.json')
          active = load('Q12_ACTIVE_ENFORCEMENT.json')
          configured_pass = gate_rc == 0 and isinstance(raw, dict) and raw.get('status') == 'PASS'
          active_pass = active_rc == 0 and isinstance(active, dict) and active.get('status') == 'PASS'
          passed = configured_pass and active_pass
          diagnostic_parts = []
          for path in ('q12-gate-error.txt', 'q12-active-error.txt'):
              try:
                  value = Path(path).read_text(encoding='utf-8').strip()
              except FileNotFoundError:
                  value = ''
              if value:
                  diagnostic_parts.append(value)
          evidence = {
              'schema_version': 9,
              'gate': 'Q12',
              'source_sha': sha,
              'source_tree': tree,
              'release_subject_manifest_sha256': subject,
              'application_subject_manifest_sha256': application_subject,
              'github_run_id': int(run_id),
              'environment_class': 'self-hosted-linux-delegated-cgroup-v2',
              'runner_name': os.getenv('RUNNER_NAME_VALUE'),
              'runner_os': os.getenv('RUNNER_OS_VALUE'),
              'runner_arch': os.getenv('RUNNER_ARCH_VALUE'),
              'required_identity': 'non-root CK-NEXUS service identity',
              'runner_user': Path('q12-runner-user.txt').read_text(encoding='utf-8').strip(),
              'expected_verifier_commit': Path('q12-expected-verifier-sha.txt').read_text(encoding='utf-8').strip(),
              'expected_verifier_tree': Path('q12-expected-verifier-tree.txt').read_text(encoding='utf-8').strip(),
              'verifier_commit': Path('q12-verifier-sha.txt').read_text(encoding='utf-8').strip(),
              'verifier_tree': Path('q12-verifier-tree.txt').read_text(encoding='utf-8').strip(),
              'verifier_identity_match': True,
              'delegated_root': os.environ['CKNEXUS_AGNES_CGROUP_ROOT'],
              'controllers': Path('q12-controllers.txt').read_text(encoding='utf-8').split(),
              'subtree_control': Path('q12-subtree-control.txt').read_text(encoding='utf-8').split(),
              'delegation_ready': True,
              'configured_limits_verified': configured_pass,
              'active_kernel_enforcement': active_pass,
              'actual_kernel_enforcement': active_pass,
              'gate_exit_code': gate_rc,
              'active_probe_exit_code': active_rc,
              'configured_limit_probe': raw,
              'active_enforcement_probe': active,
              'result': 'PASS' if passed else 'FAIL',
              'production_promotion_allowed': passed,
              'diagnostic': '\n'.join(diagnostic_parts)[:2000],
          }
          Path('Q12_CGROUP_V2.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          public = {k: v for k, v in evidence.items() if k != 'diagnostic'}
          print(json.dumps(public, indent=2, sort_keys=True))
          PY

      - name: Upload Q12 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q12-final-${{ env.Q12_SOURCE_SHA }}-${{ github.run_id }}
          path: |
            Q12_CGROUP_V2.json
            Q12_CGROUP_RAW.json
            Q12_ACTIVE_ENFORCEMENT.json
            q12-delegated-root.txt
            q12-controllers.txt
            q12-subtree-control.txt
            q12-runner-user.txt
            q12-application-subject.txt
            q12-expected-verifier-sha.txt
            q12-expected-verifier-tree.txt
            q12-verifier-sha.txt
            q12-verifier-tree.txt
            q12-gate-error.txt
            q12-active-error.txt
          if-no-files-found: error

      - name: Enforce Q12
        run: |
          python3 - <<'PY'
          import json
          x = json.load(open('Q12_CGROUP_V2.json', encoding='utf-8'))
          assert x['application_subject_manifest_sha256'] == 'dff89dc7fa9cd6e40480c3344f688a75383ec798929efe23f3a29c79d1186cec'
          assert x['verifier_identity_match'] is True
          assert x['expected_verifier_commit'] == x['verifier_commit']
          assert x['expected_verifier_tree'] == x['verifier_tree']
          assert x['configured_limits_verified'] is True
          assert x['active_kernel_enforcement'] is True
          assert x['actual_kernel_enforcement'] is True
          assert x['result'] == 'PASS'
          assert x['production_promotion_allowed'] is True
          PY
