name: CK-NEXUS Closure Converge V3

on:
  workflow_dispatch:
    inputs:
      q10_scan_manifest:
        description: Path to sealed Q10 scan manifest
        required: true
        default: evidence/q10/native/scan-manifest.json
      q10_report:
        description: Path to sealed Codex Security report.md
        required: true
        default: evidence/q10/native/report.md
      run_q12:
        description: Run Q12 on the dedicated self-hosted delegated runner
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  EXPECTED_SUBJECT: 89f2925cd871332b16f755f0dae1e058826c38b728f66d2001f2eaaec6301a52

jobs:
  q10:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: verify
        name: Verify genuine sealed Q10 evidence
        shell: bash
        run: |
          set -euo pipefail
          python .github/release-tools/codex_security_bridge.py \
            --scan-manifest '${{ inputs.q10_scan_manifest }}' \
            --report '${{ inputs.q10_report }}' \
            --output q10-normalized.json
          echo 'passed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: q10-normalized-evidence
          path: q10-normalized.json
          if-no-files-found: error

  q11:
    needs: q10
    if: needs.q10.outputs.passed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.smoke.outputs.passed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --all-extras --dev --frozen
      - id: smoke
        name: Run credential-isolated Q11 live smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: ${{ vars.OPENAI_SMOKE_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python .github/release-tools/q11_live_runner.py --output q11-live.json
          echo 'passed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: q11-live-evidence
          path: q11-live.json
          if-no-files-found: error

  q12:
    needs: [q10, q11]
    if: inputs.run_q12 && needs.q10.outputs.passed == 'true' && needs.q11.outputs.passed == 'true'
    runs-on: [self-hosted, linux, cknexus-q12]
    outputs:
      passed: ${{ steps.cgroup.outputs.passed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enforce non-root identity
        run: test "$(id -u)" -ne 0
      - id: cgroup
        name: Run delegated cgroup v2 gate
        env:
          CKNEXUS_ENVIRONMENT: staging
          CKNEXUS_AGNES_CGROUP_ROOT: ${{ vars.CKNEXUS_AGNES_CGROUP_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/release-tools/q12_cgroup_runner.py --output q12-live.json
          echo 'passed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: q12-live-evidence
          path: q12-live.json
          if-no-files-found: error

  status:
    needs: [q10, q11, q12]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize fail-closed convergence
        shell: bash
        run: |
          {
            echo '## CK-NEXUS Closure Converge V3'
            echo "Q10: ${{ needs.q10.result }}"
            echo "Q11: ${{ needs.q11.result }}"
            echo "Q12: ${{ needs.q12.result }}"
            echo
            echo 'Production status remains NO-GO until Q10/Q11/Q12 evidence is normalized, committed on the closure line, provenance is re-reconciled, and the checksummed final package is built and reviewed.'
          } >> "$GITHUB_STEP_SUMMARY"
