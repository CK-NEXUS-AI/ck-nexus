name: Q10-Q12 operator preflight

on:
  push:
    branches: [ops/q10-q12-production-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout operator pack
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify frozen authority and gate inputs
        run: python .github/release-tools/q10_q12_operator_preflight.py
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --all-extras --dev --frozen
      - name: Cloud Linux host diagnostics
        run: |
          id
          uname -a
          mount | grep cgroup || true
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
          unshare -Urmpn --fork /bin/true || true
          .venv/bin/python scripts/agnes_sandbox_doctor.py || true
          .venv/bin/python scripts/agnes_cgroup_v2_staging_gate.py || true
      - name: Privileged Linux Phase-3 candidate
        run: |
          docker run --rm --privileged --cgroupns=host \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            ubuntu:24.04 bash -lc '
              apt-get update >/dev/null &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y git gcc util-linux python3 python3-pip curl >/dev/null &&
              python3 -m pip install --break-system-packages uv >/dev/null &&
              export UV_PROJECT_ENVIRONMENT=/tmp/ckvenv &&
              uv sync --all-extras --dev --frozen >/dev/null &&
              export CKNEXUS_ENVIRONMENT=staging &&
              /tmp/ckvenv/bin/python scripts/agnes_sandbox_doctor.py || true;
              CKNEXUS_ENVIRONMENT=staging /tmp/ckvenv/bin/python scripts/agnes_cgroup_v2_staging_gate.py || true;
              /tmp/ckvenv/bin/pytest -q tests/test_agnes_execution_kernel_phase3.py tests/test_r18_cgroup_v2_staging_enforcement.py tests/test_sandbox_platform_profile.py
            '
      - name: Verify Q10 request is fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/q10/Q10_SCAN_REQUEST_FINAL_SUBJECT.json').read_text())
          assert p['status']=='PREPARED_NOT_EXECUTED'
          assert p['required_executor']=='Codex Security Deep Security Scan'
          assert p['target_sha']=='512837c8b1a3e6e8e844252a1b0781d8de011b07'
          assert p['target_tree_sha']=='43f9cb9691a0d028a1ef396a0a475c5cd80c4a99'
          assert p['release_subject_manifest_sha256']=='96dcd0f0f93b1aaa69e88da30fedcce1b786b51b83f36b72baf7ac910d02b04f'
          assert p['target_scope']=='.'
          assert p['scan_mode']=='deep'
          assert p['acceptance']['must_use_native_codex_security_deep_scan'] is True
          assert p['production_status']=='NO-GO'
          print('Q10 request contract PASS')
          PY
