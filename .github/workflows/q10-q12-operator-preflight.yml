name: Q10-Q12 operator preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify candidate identity and fail-closed Q10-Q12 inputs
        run: python3 .github/release-tools/q10_q12_operator_preflight.py
      - name: Verify Q10 request declares the complete non-Codex toolset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/q10/Q10_SCAN_REQUEST_FINAL_SUBJECT.json').read_text(encoding='utf-8'))
          required={'Semgrep','Bandit','Gitleaks','pip-audit','Trivy','CK-NEXUS security regression','coverage/completeness'}
          assert p['status'] in {'PREPARED_NOT_EXECUTED','EXECUTED_PENDING_REVIEW'}
          assert p['scan_mode']=='layered'
          assert required.issubset(set(p['required_tools']))
          assert p['production_status']=='NO-GO'
          print('Q10 request contract PASS; whole Q10 remains unverified until independent review and Owner approval.')
          PY
