name: Q10-Q12 operator preflight

on:
  pull_request:
    branches: [release/q10-q16-closure]
    paths:
      - 'evidence/Q10_DEPENDENCY_AUDIT.json'
      - 'evidence/Q11_OPENAI_LIVE.json'
      - 'evidence/Q12_CGROUP_V2.json'
      - 'evidence/q10/Q10_SCAN_REQUEST_FINAL_SUBJECT.json'
      - '.github/release-tools/q10_q12_operator_preflight.py'
      - '.github/workflows/q10-q12-operator-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout operator pack
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify frozen authority and gate inputs
        run: python .github/release-tools/q10_q12_operator_preflight.py
      - name: Verify Q10 request is fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/q10/Q10_SCAN_REQUEST_FINAL_SUBJECT.json').read_text())
          assert p['status']=='PREPARED_NOT_EXECUTED'
          assert p['required_executor']=='Codex Security Deep Security Scan'
          assert p['target_sha']=='39f5c1adb9d761ab418cf088ff1f051b1ca731d1'
          assert p['target_tree_sha']=='0525195934f703a8becf8a39f6397b2411e0bb2e'
          assert p['release_subject_manifest_sha256']=='89f2925cd871332b16f755f0dae1e058826c38b728f66d2001f2eaaec6301a52'
          assert p['application_subject_manifest_sha256']=='dff89dc7fa9cd6e40480c3344f688a75383ec798929efe23f3a29c79d1186cec'
          assert p['target_scope']=='.'
          assert p['scan_mode']=='deep'
          assert p['acceptance']['must_use_native_codex_security_deep_scan'] is True
          assert p['production_status']=='NO-GO'
          print('Q10 request contract PASS')
          PY
