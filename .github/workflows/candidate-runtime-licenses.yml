name: Candidate runtime licenses

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate commit SHA; defaults to this workflow's commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  runtime_licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Resolve exact candidate identity
        id: subject
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          target_sha="${REQUESTED_TARGET_SHA:-$GITHUB_SHA}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$target_sha^{commit}" 2>/dev/null; then git fetch --no-tags origin "$target_sha"; fi
          git checkout --detach "$target_sha"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Build exact production image
        run: docker build -t cknexus-license:${{ steps.subject.outputs.target_sha }} .
      - name: Generate runtime-only license inventory
        shell: bash
        run: |
          docker run --rm -i cknexus-license:${{ steps.subject.outputs.target_sha }} python3 - <<'PY' > Q16_RUNTIME_LICENSE_INVENTORY.json
          import hashlib
          import importlib.metadata as md
          import json
          from pathlib import Path

          rows=[]
          for dist in md.distributions():
              name=(dist.metadata.get('Name') or '').strip()
              if name.lower() == 'ck-nexus-creator':
                  continue
              classifiers=[x for x in dist.metadata.get_all('Classifier',[]) if x.startswith('License ::')]
              license_files=[]
              for rel in dist.files or []:
                  text=str(rel)
                  base=Path(text).name.lower()
                  if any(token in base for token in ('license','licence','copying','notice')):
                      try:
                          absolute=dist.locate_file(rel)
                          data=Path(absolute).read_bytes()
                          license_files.append({'path':text,'sha256':hashlib.sha256(data).hexdigest()})
                      except OSError:
                          license_files.append({'path':text,'sha256':None})
              project_urls={}
              for value in dist.metadata.get_all('Project-URL',[]):
                  if ', ' in value:
                      key,url=value.split(', ',1)
                      project_urls[key]=url
              row={
                  'name':name,
                  'version':dist.version,
                  'license_expression':dist.metadata.get('License-Expression'),
                  'license':dist.metadata.get('License'),
                  'license_classifiers':classifiers,
                  'license_files':license_files,
                  'home_page':dist.metadata.get('Home-page'),
                  'project_urls':project_urls,
              }
              row['license_evidence_present']=bool(
                  row['license_expression'] or row['license'] or classifiers or license_files
              )
              rows.append(row)
          rows.sort(key=lambda x:x['name'].lower())
          print(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - name: Export exact runtime license files
        env:
          TARGET_SHA: ${{ steps.subject.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-licenses
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --user "$(id -u):$(id -g)" -v "$PWD/runtime-licenses:/out" \
            "cknexus-license:$TARGET_SHA" python3 - <<'PY'
          import hashlib, importlib.metadata as md, json, re
          from pathlib import Path
          root=Path('/out')
          files=[]
          distributions=[]
          for dist in md.distributions():
              name=(dist.metadata.get('Name') or '').strip()
              if name.lower()=='ck-nexus-creator':
                  continue
              version=dist.version
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',f'{name}-{version}')
              target=root/'licenses'/safe
              exported=[]
              for index,rel in enumerate(dist.files or []):
                  base=Path(str(rel)).name
                  if not any(token in base.lower() for token in ('license','licence','copying','notice')):
                      continue
                  try: data=Path(dist.locate_file(rel)).read_bytes()
                  except OSError: continue
                  target.mkdir(parents=True,exist_ok=True)
                  destination=target/f'{index:03d}-{base}'
                  destination.write_bytes(data)
                  item={'path':str(destination.relative_to(root)),'sha256':hashlib.sha256(data).hexdigest()}
                  files.append(item); exported.append(item)
              distributions.append({'name':name,'version':version,'files':exported})
          distributions.sort(key=lambda x:x['name'].lower())
          assert distributions and files
          (root/'EXPORT_MANIFEST.json').write_text(json.dumps({
              'schema_version':1,'distribution_count':len(distributions),
              'file_count':len(files),'distributions':distributions,'files':files
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Enforce license-evidence completeness
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          rows=json.load(open('Q16_RUNTIME_LICENSE_INVENTORY.json',encoding='utf-8'))
          unresolved=[f"{x['name']}=={x['version']}" for x in rows if not x['license_evidence_present']]
          print('runtime distributions=',len(rows))
          print('unresolved license evidence=',unresolved)
          with open('Q16_RUNTIME_LICENSE_SUMMARY.json','w',encoding='utf-8') as f:
              json.dump({
                  'runtime_distribution_count':len(rows),
                  'unresolved_license_evidence':unresolved,
                  'result':'PASS' if not unresolved else 'REVIEW_REQUIRED',
              },f,indent=2,sort_keys=True); f.write('\n')
          raise SystemExit(1 if unresolved else 0)
          PY
      - name: Bind inventory to release subject
        if: always()
        env:
          HEAD_SHA: ${{ steps.subject.outputs.target_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          subject=$(git ls-tree -r HEAD -- app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          inventory_sha=$(sha256sum Q16_RUNTIME_LICENSE_INVENTORY.json 2>/dev/null | awk '{print $1}')
          python3 - "$HEAD_SHA" "$tree" "$subject" "$RUN_ID" "$inventory_sha" <<'PY'
          import json,sys
          sha,tree,subject,run_id,inventory_sha=sys.argv[1:]
          p='Q16_RUNTIME_LICENSE_SUMMARY.json'
          try: x=json.load(open(p,encoding='utf-8'))
          except FileNotFoundError: x={'result':'FAIL','unresolved_license_evidence':['inventory_generation_failed']}
          x.update({
              'schema_version':2,
              'gate':'Q16_RUNTIME_LICENSES',
              'source_sha':sha,
              'source_tree':tree,
              'release_subject_manifest_sha256':subject,
              'github_run_id':int(run_id),
              'inventory_sha256':inventory_sha or None,
              'production_promotion_allowed':x.get('result')=='PASS' and not x.get('unresolved_license_evidence'),
              'scope':'exact installed production Docker runtime; CK-NEXUS proprietary distribution excluded',
          })
          with open(p,'w',encoding='utf-8') as f:
              json.dump(x,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - name: Upload runtime-license evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q16-runtime-licenses-${{ steps.subject.outputs.target_sha }}
          path: |
            Q16_RUNTIME_LICENSE_INVENTORY.json
            Q16_RUNTIME_LICENSE_SUMMARY.json
            runtime-licenses/
          if-no-files-found: error
