name: Trusted Verifier Allowlist Discovery

on:
  pull_request:
    paths:
      - '.github/workflows/trusted-verifier-allowlist-ci.yml'
      - 'creator_app/dynamic_verifier/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE_REF: ghcr.io/ck-nexus-ai/ck-nexus-verifier-python@sha256:fee488944575873dd7e1e42e355f5272953cba8bf6342e9ea043f8e257c1d60c

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve published verifier image digest
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          found=0
          for attempt in 1 2 3 4 5 6; do
            if docker pull "$IMAGE_REF"; then
              found=1
              break
            fi
            echo "image not available yet; attempt=$attempt" >&2
            sleep 10
          done
          test "$found" -eq 1
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")"
          case "$digest_ref" in
            ghcr.io/ck-nexus-ai/ck-nexus-verifier-python@sha256:*) ;;
            *) echo 'unexpected published image digest' >&2; exit 1 ;;
          esac
          test "$digest_ref" = "$IMAGE_REF"
          echo "TRUSTED_VERIFIER_IMAGE=$digest_ref" >> "$GITHUB_ENV"
          echo "trusted_verifier_image=$digest_ref"

      - name: Verify runtime image metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format='{{.Config.User}}' "$TRUSTED_VERIFIER_IMAGE")" = '65532:65532'
          test "$(docker image inspect --format='{{json .Config.Entrypoint}}' "$TRUSTED_VERIFIER_IMAGE")" = '["/cknexus/verify"]'
          echo 'published verifier image metadata PASS'

      - name: Production boundary
        run: |
          echo 'Digest discovery is development evidence only.'
          echo 'No Q10/Q11/Q12 promotion. PR #14 remains untouched. Production NO-GO.'
