name: AnyClaw Control Bridge CI

on:
  pull_request:
    paths:
      - 'integrations/anyclaw-control-bridge/**'
      - '.github/workflows/anyclaw-control-bridge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: integrations/anyclaw-control-bridge
        run: npm install --ignore-scripts
      - name: Typecheck
        working-directory: integrations/anyclaw-control-bridge
        run: npm run typecheck
      - name: Verify bridge remains fail-closed by default
        shell: bash
        run: |
          grep -q "Refusing non-loopback bind without CKNEXUS_ANYCLAW_TOKEN" integrations/anyclaw-control-bridge/src/index.ts
          grep -q "Production status remains NO-GO" integrations/anyclaw-control-bridge/README.md
