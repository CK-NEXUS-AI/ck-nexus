name: Closure dependency lock refresh

on:
  push:
    branches: [closure/one-shot-evidence-closure-20261002]
    paths:
      - 'pyproject.toml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh frozen dependency lock
        run: |
          python -m pip install --upgrade pip uv
          uv lock --upgrade-package httpx2 --upgrade-package PyJWT --upgrade-package urllib3 --upgrade-package httpcore2
      - name: Commit lock refresh
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'security: refresh vulnerable dependency lock'
          git push
