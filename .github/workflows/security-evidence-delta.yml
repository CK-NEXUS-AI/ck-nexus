name: Security Evidence Delta

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.py'
      - '**/Dockerfile*'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'poetry.lock'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  osv-sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare evidence directory
        run: mkdir -p security-evidence-delta
      - name: OSV dependency scan
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output=security-evidence-delta/osv-results.json
            --recursive
            ./
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-evidence
          path: security-evidence-delta/osv-results.json

  checkov-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov
      - name: Scan Dockerfile and GitHub Actions
        run: |
          mkdir -p security-evidence-delta
          checkov -d . --framework dockerfile github_actions --output json > security-evidence-delta/checkov-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-evidence
          path: security-evidence-delta/checkov-results.json

  zap-local-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CK-NEXUS
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Start local CK-NEXUS test server
        run: |
          nohup python main.py > /tmp/ck-nexus-zap.log 2>&1 &
          echo $! > /tmp/ck-nexus-zap.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ck-nexus-zap.log
          exit 1
      - name: Run ZAP baseline against localhost only
        run: |
          mkdir -p security-evidence-delta
          docker run --rm --network host \
            -v "$PWD/security-evidence-delta:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 \
            -J zap-report.json -r zap-report.html || true
      - name: Upload ZAP evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-local-evidence
          path: |
            security-evidence-delta/zap-report.json
            security-evidence-delta/zap-report.html
